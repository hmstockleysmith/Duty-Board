}
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const canRelieveOut = m => !!(m.reliever || m.ext); // core, temp transfers and SOs are never sent out
function tagsHTML(m, activeShift){
  let h='<span class="tags">';
  const rank = m.rank==="FF" ? (m.cls||"FF") : m.rank;
  h+='<span class="tag rank">'+esc(rank)+'</span>';
  if(m.stripe&&m.rank==="FF") h+='<span class="tag rank">STRIPE</span>';
  if(m.reliever&&!m.ext) h+='<span class="tag vis">RELIEVER</span>';
  if(m.staying) h+='<span class="tag vis">STAYING</span>';
  if(activeShift && m.shift!==activeShift) h+='<span class="tag vis">'+esc(m.shift)+' SHIFT</span>';
  if(m.note) h+='<span class="tag vis">'+esc(m.note)+'</span>';
  [["topo","TOPO"],["clp","CLP"],["vr","VR"],["csr","CSR"],["rrs","RRS"]].forEach(([k,l])=>{ if(m[k]) h+='<span class="tag q">'+l+'</span>'; });
  return h+'</span>';
}

function render(){
  // Auto-clear any Relieving out whose end date has passed — done before anything else
  // reads availability so filters, sign-on list and roster all see the updated status.
  const rc = autoClearRelievingOut();
  if(rc) say(rc+" member"+(rc===1?"":"s")+" auto-cleared from Relieving out (scheduled return reached).","info");
  const members=state.members;
  const active=state.shift;
  const occ=occupancy(members);
  const counts=shiftCounts(members);
  const issues=boardIssues(members);
  // On-duty queue: EVERYONE on duty in sign-on order — seated crew, core awaiting a seat,
  // and relievers in the pool. Relievers keep their time and place: if a core member never
  // shows and the reliever ends up staying, their spot in first-on-first-off already stands.
  const queue=members.filter(m=>m.status==="on").sort((a,b)=>a.signOn-b.signOn);
  const relPool=members.filter(m=>m.status==="on"&&!m.seatId&&canRelieveOut(m));
  // People currently being covered by a standby aren't available to be called in — the swap
  // handles their absence. Members released from this shift by a Super holdback are also out.
  const coveredIds = new Set(members.filter(m=>m.status==="on"&&m.ot==="Standby"&&m.coveringFor).map(m=>m.coveringFor));
  const avail=members.filter(m=>m.status==="off"&&m.avail==="Available"&&!coveredIds.has(m.id)&&!releasedFromActive(m));
  const incoming=avail.filter(m=>!m.ext&&m.shift===active);
  const otherShift=avail.filter(m=>!m.ext&&m.shift!==active);
  const relievers=avail.filter(m=>m.ext);
  const offGoing=members.filter(m=>m.status==="out");
  const sel=selectedId?members.find(m=>m.id===selectedId):null;

  const duty = currentDuty();
  document.getElementById("shiftsel").innerHTML =
    SHIFTS.map(s=>'<button class="'+(s===active?"on":"")+(s===duty.shift?" nowdot":"")+'" onclick="setActiveShift(\''+s+'\')">'+s+'</button>').join("");
  const nowD=nowDate();
  const dl=document.getElementById("dutynow");
  const onNow='ON NOW: '+duty.shift+' shift · '+duty.phase+' · <span id="nowdate">'+nowD.toLocaleDateString([], {weekday:"long",day:"2-digit",month:"short",year:"numeric"})+'</span> · <span id="nowtime">'+fmt(nowD.getTime())+'</span>';
  dl.innerHTML = onNow + (active!==duty.shift ? ' <button class="jumpbtn" onclick="setActiveShift(\''+duty.shift+'\')">viewing '+active+' — back to '+duty.shift+'</button>' : '');

  const clpOff = truckOffline("clp");
  const clpFilled=["clp-1","clp-2"].every(id=>occ[id]&&seatEligibility(seatById(id),occ[id]).ok);
  const clpChip = clpOff
    ? '<div class="chip" style="align-items:center;border-color:var(--faint);color:var(--faint)"><span class="lbl">CLP OFFLINE</span></div>'
    : '<div class="chip '+(clpFilled?"ok":"bad")+'" style="align-items:center"><span class="lbl">CLP '+(clpFilled?"CREWED":"SHORT")+'</span></div>';
  const vs=vrStatus(members);
  const vrChip='<div class="chip '+(vs.met?"ok":"bad")+'" title="'+(vs.soVR?"SO with VR present":"needs an SO with VR")+(vs.subUsed?" · incl. 1 CSR/RRS":"")+'"><span class="lbl">VR'+(vs.subUsed?"*":"")+'</span><span class="val">'+vs.effective+'<span class="of">/'+VR_TOTAL+'</span></span></div>';
  document.getElementById("strip").innerHTML =
    vrChip + chip("SNAPS (SO)",counts.so,REQ_SO)+ clpChip +
    '<div class="clock" id="stripclock">'+fmt(nowMs())+'</div>';

  const tick=document.getElementById("ticker");
  tick.innerHTML=esc(msg.text)+(undoSnap?' <button class="jumpbtn" onclick="undo()">Undo</button>':'');
  tick.className="t-"+msg.tone;
  const reh=document.getElementById("rehbanner");
  if(reh){
    if(rehearsal){
      const vd = nowDate();
      const vHHMM = String(vd.getHours()).padStart(2,"0")+":"+String(vd.getMinutes()).padStart(2,"0");
      const dateStr = vd.toLocaleDateString([], {weekday:"short",day:"2-digit",month:"short"});
      reh.innerHTML = '<span>▶ REHEARSAL · '+esc(dateStr)+' · <input type="time" value="'+vHHMM+'" onchange="setRehearsalTime(this.value)" style="background:#12161b;color:var(--amber);border:1px solid var(--amber);border-radius:5px;padding:2px 6px;font-family:inherit;font-weight:900"> · nothing saves</span><span style="display:flex;gap:6px"><button onclick="setRehearsalTime(\'06:00\')">06:00</button><button onclick="setRehearsalTime(\'16:00\')">16:00</button><button onclick="setRehearsalTime(\'18:00\')">18:00</button><button onclick="exitRehearsal()">Exit rehearsal</button></span>';
    } else reh.innerHTML = '';
  }
  // Release notifications (session, 60s TTL) — full-width cards below the strip.
  const rel = document.getElementById("relnotes");
  if(rel){
    pruneReleases();
    if(!releaseNotes.length){ rel.innerHTML = ''; }
    else rel.innerHTML = releaseNotes.map(n=>{
      let skip = '';
      if(n.skipNotes && n.skipNotes.length){
        skip = '<div class="rskip"><b>QUEUE SKIPPED</b><br>'+n.skipNotes.map(esc).join('<br>')+'</div>';
      }
      return '<div class="relnote"><div class="rhd"><span>▶ '+esc(n.title)+' · '+fmt(n.ts)+'</span><button class="rx" onclick="dismissRelease('+n.id+')">Dismiss</button></div><div class="rbd">'+esc(n.body)+'</div>'+skip+'</div>';
    }).join('');
  }

  if(tab==="board") renderBoard({occ,counts,issues,queue,relPool,incoming,otherShift,relievers,offGoing,sel,active});
  else if(tab==="forecast") renderForecast();
  else if(tab==="roster") renderRoster();
  else renderStandbys();
  renderBar(sel);
}
function chip(lbl,val,req){
  const ok=val>=req;
  return '<div class="chip '+(ok?"ok":"bad")+'"><span class="lbl">'+lbl+'</span><span class="val">'+val+'<span class="of">/'+req+'</span></span></div>';
}

function renderBoard(d){
  const {occ,counts,issues,queue,relPool,incoming,otherShift,relievers,offGoing,sel,active}=d;
  const q = signQuery.trim().toLowerCase();
  const match = m => !q || m.name.toLowerCase().includes(q);
  // Relievers get a "Staying at Perth" checkbox next to their name at sign-on. If ticked,
  // tapping them signs on with staying=true, which prefers seating and blocks send-relieving.
  // Non-relievers keep the plain row.
  const rowBtn = (m,size) => {
    if(canRelieveOut(m)){
      const stay = !!stayingReliever[m.id];
      const onclick = stay ? "signOnStaying" : "signOn";
      return '<div class="relrow" style="display:flex;gap:6px;align-items:stretch;margin-bottom:8px">'+
        '<button class="rowbtn" style="flex:1;margin:0" onclick="'+onclick+'('+m.id+')"><span class="nm"'+(size?' style="font-size:'+size+'"':'')+'>'+esc(m.name)+'</span>'+tagsHTML(m,active)+'</button>'+
        '<label class="tog'+(stay?" on":"")+'" style="display:flex;align-items:center;padding:0 10px;cursor:pointer;font-size:11px" title="Reliever staying at Perth: seat them, don\'t send out"><input type="checkbox" style="display:none" '+(stay?"checked":"")+' onchange="toggleStayingReliever('+m.id+')">STAYING</label>'+
        '</div>';
    }
    return '<button class="rowbtn" style="margin-bottom:8px" onclick="signOn('+m.id+')"><span class="nm"'+(size?' style="font-size:'+size+'"':'')+'>'+esc(m.name)+'</span>'+tagsHTML(m,active)+'</button>';
  };

  let colA='<div class="col col-signon">';
  colA+='<div class="panel"><div class="hd"><span>Sign on</span><span>'+active+' shift</span></div><div class="bd">';
  colA+='<input class="searchbox" placeholder="Search any name across all shifts…" value="'+esc(signQuery)+'" oninput="setSignQuery(this.value)">';

  // Active shift first
  const inc = incoming.filter(match);
  colA+='<div class="grouplbl">'+active+' shift · rostered</div>';
  colA+= inc.length ? inc.map(m=>rowBtn(m)).join("")
    : '<div class="empty-note">'+(q?"No match on "+active+" shift.":"No one from "+active+" shift marked Available.")+'</div>';

  // Other shifts, grouped, only when searching or expanded
  const otherMatched = otherShift.filter(match);
  const showOther = q ? true : othersOpen;
  colA+='<button class="grouptoggle" onclick="toggleOthers()">'+(showOther?"▾":"▸")+' Other shifts · call back / hold back (OT) ('+otherMatched.length+')</button>';
  if(showOther){
    SHIFTS.filter(s=>s!==active).forEach(sh=>{
      const g=otherMatched.filter(m=>m.shift===sh);
      if(!g.length) return;
      colA+='<div class="grouplbl sub">'+sh+' shift</div>';
      colA+=g.map(m=>rowBtn(m,"14px")).join("");
    });
    if(!otherMatched.length) colA+='<div class="empty-note">'+(q?"No match on other shifts.":"None available.")+'</div>';
  }

  // External relievers
  const relMatched = relievers.filter(match);
  colA+='<button class="grouptoggle" onclick="toggleRelievers()">'+(relOpen?"▾":"▸")+' External relievers ('+relMatched.length+')</button>';
  if(relOpen){
    colA+= relMatched.length ? relMatched.map(m=>rowBtn(m,"14px")).join("") : '<div class="empty-note">None added yet.</div>';
    colA+= relForm
      ? relieverFormHTML()
      : '<button class="ctl" style="margin-top:6px" onclick="openRelieverForm()">+ Add external reliever</button>';
  }
  colA+='</div></div>';
  const poolRow = m =>
      '<button class="rowbtn" style="margin-bottom:8px'+(selectedId===m.id?';border-color:var(--amber);background:var(--amberbg)':'')+'" onclick="selectMember('+m.id+')"><span class="nm" style="font-size:14px">'+esc(m.name)+' <span style="color:var(--faint);font-size:12px;font-weight:500">on '+fmt(m.signOn)+'</span></span>'+tagsHTML(m,active)+'</button>';
  colA+='<div class="panel"><div class="hd"><span>Relievers · on station</span><span>'+relPool.length+'</span></div><div class="bd">';
  colA+= relPool.length
    ? '<div class="note" style="margin:0 0 8px">Signed on, not crewing a truck — available to be sent out to cover metro shortfalls. Tap a name, then Send relieving.</div>'+relPool.map(poolRow).join("")
    : '<div class="empty-note">No relievers on station. Relievers (home or external) sign on straight into this pool and relieve no one automatically — send them out, seat them manually, or use Relieve next out.</div>';
  colA+='</div></div>';
  colA+='<div class="panel"><div class="hd"><span>Off-going</span><span>'+offGoing.length+'</span></div><div class="bd">';
  colA+= offGoing.length ? offGoing.map(m=>
    '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px"><span style="color:var(--dim)">'+esc(m.name)+(m.ot?(m.ot==="Standby"?" · Standby":" · OT "+m.ot):"")+'</span>'+tagsHTML(m,active)+'</div>'
  ).join("") : '<div class="empty-note">No one relieved yet.</div>';
  colA+='</div></div></div>';

  let colB='<div class="col">';
  colB+='<div class="panel"><div class="hd"><span>'+active+' shift · crew &amp; rotation</span></div><div class="bd"><div style="display:flex;gap:8px;flex-wrap:wrap">';
  colB+='<button class="ctl" onclick="applySetArrangement()">Apply current set</button>';
  colB+='<button class="ctl warn" onclick="rotateCrews()">Start next set (rotate)</button>';
  colB+='<button class="ctl" onclick="applyTemplate()">Apply '+active+' default</button>';
  colB+='<button class="ctl" onclick="saveTemplate()">Save '+active+' default</button>';
  colB+='</div>';
  // Forecast holdbacks for this shift, if any — shown at top so the SO can plan releases first.
  const fcHb = state.members.filter(m => m.shift===active && m.forecastHoldback);
  if(fcHb.length){
    colB+='<div style="margin-top:10px;padding:8px 10px;background:var(--panel);border-left:3px solid var(--amber);border-radius:4px"><div style="font-size:11px;font-weight:800;letter-spacing:1px;color:var(--amber);margin-bottom:4px">FORECAST HOLDBACKS · '+fcHb.length+'</div>';
    fcHb.forEach(m => {
      colB+='<div style="font-size:12px;padding:2px 0"><b>'+esc(m.name)+'</b> · '+esc(m.forecastHoldback)+' <button class="ctl" style="font-size:10px;padding:1px 6px;margin-left:6px" onclick="setForecastHoldback('+m.id+',\'\')">Clear</button></div>';
    });
    colB+='</div>';
  }
  // Look ahead to the next shift's coverage. If expected-off flags produce a shortfall,
  // surface it here so the SO knows a holdback is likely coming from the current shift.
  const nextFC = defaultForecastTarget();
  const nextFeas = forecastFeasibility(nextFC.iso, nextFC.phase);
  const nextCov = nextFeas.cov;
  const anyExpectedOff = state.members.some(m => m.expectedOff && m.shift===nextCov.platoon);
  if(!nextFeas.ok && anyExpectedOff){
    const nextLabel = nextFC.phase+" · "+nextCov.platoon+" platoon";
    colB+='<div style="margin-top:10px;padding:8px 10px;background:#3a1810;border-left:3px solid var(--red);border-radius:4px"><div style="font-size:11px;font-weight:800;letter-spacing:1px;color:var(--red);margin-bottom:4px">HOLDBACK EXPECTED · NEXT SHIFT ('+esc(nextLabel)+')</div>';
    colB+='<div style="font-size:12px;color:var(--dim);margin-bottom:4px">The holdback (or callback) must cover: <b style="color:var(--text)">'+nextFeas.missing.map(esc).join("; ")+'</b>.</div>';
    const nextSOP = forecastShortageOrder(nextFC.iso, nextFC.phase);
    if(nextSOP && nextSOP.order[0].action==="Hold Back"){
      colB+='<div style="font-size:11px;color:var(--faint)">SOP 1st relief: <b style="color:var(--amber)">'+esc(nextSOP.order[0].platoon)+' Hold Back</b>'+(nextSOP.order[0].platoon===active?' (that\'s this shift)':'')+'</div>';
    }
    colB+='<div style="margin-top:6px"><button class="ctl" style="font-size:11px;padding:2px 8px" onclick="setTab(\'forecast\')">Open Forecast tab</button></div>';
    colB+='</div>';
  }
  colB+='</div></div>';
  TRUCKS.forEach(t=>{
    const off = truckOffline(t.id);
    colB+='<div class="truck'+(off?' offline':'')+'"><div class="hd"><span class="platebadge'+(off?' grey':'')+'">'+t.name+'</span><span class="sub">'+t.sub+'</span>'+
      '<button class="offbtn'+(off?' on':'')+'" onclick="toggleOffline(\''+t.id+'\')">'+(off?"● OFFLINE · bring online":"Take offline")+'</button></div>';
    if(off){
      colB+='<div class="offlinebanner">TRUCK OFFLINE — not counted in crewing</div>';
    }
    colB+='<div class="seats">';
    t.seats.forEach(seat=>{
      const full={...seat,truckId:t.id,truckName:t.name};
      const m=occ[seat.id];
      let cls="empty", reason=null;
      if(m){
        const el=seatEligibility(full,m);
        reason = !el.ok ? el.reason : null;
        if(!reason && (seat.role==="FF1"||seat.role==="FF2"||seat.role==="DRV")){ const p=pairIssue(t.id,occ); if(p) reason=p; }
        cls = (reason||m.forced) ? "invalid" : "valid";
      }
      const selHere = m && selectedId===m.id;
      colB+='<button class="seat '+cls+(selHere?' sel':'')+(off?' dim':'')+'" onclick="seatTapped(\''+seat.id+'\')">';
      colB+='<div class="slabel">'+seat.label+'</div>';
      if(m){
        const badges=(m.ot?(m.ot==="Standby"?' · STANDBY':m.ot==="Super holdback"?' · SUPER HB':' · OT '+m.ot):'')+(m.excHours?' · EXC HRS':'');
        colB+='<div class="occ"><span class="nm">'+esc(m.name)+badges+'</span><span class="meta"><span class="time">'+fmt(m.signOn)+'</span>'+tagsHTML(m,active)+'</span></div>';
        if(reason) colB+='<div class="why">'+esc(reason)+'</div>';
        else if(m.forced) colB+='<div class="forced">Placed by officer override</div>';
      } else {
        colB+='<div class="invite'+(sel&&!off?' hot':'')+'">'+(off?"—":(sel?("Tap to seat "+esc(sel.name)):"Unfilled"))+'</div>';
      }
      colB+='</button>';
    });
    colB+='</div></div>';
  });
  const vsCard=vrStatus(state.members);
  colB+='<div class="vrcard"><div><div class="slabel">VR VEHICLE</div><div style="font-size:13px;color:var(--dim)">Manned from other trucks on a VR job. Minimum: SO with VR + '+VR_FF_MIN+' VR firefighters + a 4th (VR or one CSR cat-2/RRS). CLP crew don\'t count.'+(vsCard.subUsed?" · 1 CSR/RRS counted":"")+(vsCard.soVR?"":" · no SO with VR!")+'</div></div><div style="font-size:18px;font-weight:900;color:'+(vsCard.met?"var(--green)":"var(--red)")+'">'+vsCard.effective+'/'+VR_TOTAL+'</div></div>';
  colB+='</div>';

  let colC='<div class="col">';
  // Two independent FIFO queues: Station Officers are only relieved by other SOs, so their
  // order is unaffected by firefighters coming and going, and vice versa. Display matches
  // the solver's rank filter.
  const officerQ = queue.filter(m=>isOfficer(m));
  const ffQ = queue.filter(m=>!isOfficer(m));
  const qRow = (m,i) => {
    const where = fmt(m.signOn)+' · '+(m.seatId ? seatById(m.seatId).truckName : (canRelieveOut(m)?'relievers pool':'awaiting seat'));
    const inner = '<span style="font-weight:'+(i===0?800:600)+'"><span class="idx">'+String(i+1).padStart(2,"0")+'</span>'+esc(m.name)+'</span><span class="where">'+where+'</span>';
    return m.seatId
      ? '<div class="qrow'+(i===0?' first':'')+'">'+inner+'</div>'
      : '<button class="qrow'+(i===0?' first':'')+'" style="width:100%;background:none;border:none;color:inherit;font:inherit;text-align:left'+(selectedId===m.id?';color:var(--amber)':'')+'" onclick="selectMember('+m.id+')">'+inner+'</button>';
  };
  colC+='<div class="panel"><div class="hd"><span>Next out · first on, first off</span></div><div class="bd">';
  if(!queue.length) colC+='<div class="empty-note">No one seated.</div>';
  else {
    if(officerQ.length){
      colC+='<div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--faint);margin:2px 0 4px">STATION OFFICERS</div>';
      colC+=officerQ.map(qRow).join("");
    }
    if(ffQ.length){
      colC+='<div style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--faint);margin:'+(officerQ.length?'10px':'2px')+' 0 4px">FIREFIGHTERS</div>';
      colC+=ffQ.map(qRow).join("");
    }
  }
  colC+='</div></div>';

  // Crewing suggestions: for each unfilled seat, who fits
  const emptySeats = activeSeats().filter(s=>!occ[s.id]);
  if(emptySeats.length){
    colC+='<div class="panel"><div class="hd"><span>Crewing help · fill empty seats</span><span>'+emptySeats.length+'</span></div><div class="bd">';
    emptySeats.forEach(seat=>{
      const cands=candidatesForSeat(seat);
      colC+='<div class="sug"><div class="sughd">'+seat.truckName+' · '+seat.label+'</div>';
      if(!cands.length){
        colC+='<div style="font-size:12px;color:var(--amber)">No available member fits this seat. Consider a holdback or reliever below.</div>';
      } else {
        colC+='<div class="opts">';
        cands.slice(0,3).forEach((m,i)=>{
          const off = m.shift!==state.shift ? ' · '+m.shift : '';
          const tag = i===0 ? ' best' : '';
          colC+='<button class="obtn sugbtn'+tag+'" onclick="seatMember('+m.id+',\''+seat.id+'\')">'+esc(m.name)+off+'</button>';
        });
        colC+='</div>';
      }
      colC+='</div>';
    });
    colC+='</div></div>';
  }

  colC+='<div class="panel"><div class="hd"><span>Shortfalls</span>'+(issues.length?'<span style="color:var(--red)">'+issues.length+' OPEN</span>':'')+'</div><div class="bd">';
  if(!issues.length) colC+='<div style="color:var(--green);font-weight:700;font-size:14px">Shift requirements met. Board is clean.</div>';
  // For each open need: split off-going members into holdback candidates (excess-hours OK)
  // and excluded (would overrun their next rostered shift). Rank both lists by fairness:
  // never-taken OT first (lastOT null), then oldest lastOT. Fall back to callback candidates
  // when nobody can be legally held. All buttons go through the existing holdBack action so
  // it stamps the tally and lets Undo restore the previous fairness position.
  const projEndForHoldback = () => {
    // Rough projection: assume the incoming shift's duration if held all the way through.
    // Day 08–18, night 18–08. Add 10 hours to `now` as a first-pass proxy.
    return nowMs() + 10*3600000;
  };
  const rankFairness = (a,b)=>{
    const la = a.lastOT || 0, lb = b.lastOT || 0;
    return la - lb; // 0 (never) first, then oldest
  };
  const noteFor = m => m.lastOT ? "last OT "+new Date(m.lastOT).toLocaleDateString([], {day:"2-digit",month:"short"}) : "no OT recorded";
  const sop = currentShortageOrder(); // { platoon, shiftOfSet, order: [{platoon,action},...] } or null
  issues.forEach(iss=>{
    // Per-issue waterfall step: 0/1/2 into sop.order. Persists on state.shortageStep so
    // stepping through survives re-render. Keyed by need+text so multiple issues track
    // independently.
    const stepKey = iss.need+"|"+iss.text;
    state.shortageStep = state.shortageStep || {};
    let step = state.shortageStep[stepKey] || 0;
    const projEnd = projEndForHoldback();
    const holdCandidatesAll = state.members.filter(m=>m.status==="out"&&coversNeed(m,iss.need));
    const callCandidatesAll = state.members
      .filter(m=>m.status==="off"&&m.avail==="Available"&&coversNeed(m,iss.need)&&!releasedFromActive(m));

    colC+='<div class="issue"><div class="it">'+esc(iss.text)+'</div>';

    if(sop){
      // Show the SOP waterfall header
      colC+='<div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--faint);margin:4px 0 6px">SOP · '+esc(sop.platoon)+' PLATOON · '+esc(sop.shiftOfSet.toUpperCase())+' · OPS CIRCULAR 47/2016</div>';
      colC+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:11px">';
      sop.order.forEach((s,i)=>{
        const active = i===step;
        const label = s.platoon==="ASPSA" ? "ASPSA" : s.platoon+" "+s.action;
        colC+='<span style="padding:3px 8px;border-radius:4px;font-weight:700;letter-spacing:.5px;'+(active?'background:var(--amber);color:#12161b':'background:var(--panel);color:var(--faint);border:1px solid var(--line)')+'">'+(i+1)+' · '+esc(label)+'</span>';
      });
      colC+='</div>';
    }

    const currentStep = sop ? sop.order[step] : null;
    let shown=0, excludedThisStep=[];
    colC+='<div class="opts">';

    if(currentStep && currentStep.platoon==="ASPSA"){
      // ASPSA: matrix exhausted — the SO's call is either super holdback (someone works
      // through and gets released from their next shift) or truck offline. Prompt the
      // decision inline rather than picking one automatically.
      colC+='<div style="font-size:12px;color:var(--red);font-weight:700;margin:2px 0 6px">ASPSA — matrix exhausted. Super holdback or take the truck offline.</div>';
      // Offer super holdback for members currently seated on the affected truck (or any
      // seated member who covers the need if the truck can't be identified from need alone)
      const seated = state.members.filter(m=>m.status==="on"&&m.seatId&&coversNeed(m,iss.need));
      seated.sort(rankFairness);
      seated.slice(0,3).forEach(m=>{
        colC+='<button class="obtn hold" onclick="toggleOT('+m.id+',\'Super holdback\')" title="'+esc(noteFor(m))+'">Super holdback '+esc(m.name)+' <span style="font-weight:400;font-size:11px;opacity:.75">· '+esc(noteFor(m))+'</span></button>';
      });
      // Offline options: needs a truck. Infer from need if possible.
      const truckHint = iss.text.match(/PERTH 1ST|PERTH 2ND|CLP|VR/i);
      const truckHTML = TRUCKS.filter(t=>!truckOffline(t.id)).map(t=>'<button class="obtn" onclick="toggleTruckOffline(\''+t.id+'\')">Take '+esc(t.name)+' OFFLINE</button>').join("");
      colC+= truckHTML;
    } else if(currentStep){
      const platoon = currentStep.platoon;
      const action = currentStep.action;
      // Filter to the current platoon; ranks by fairness within the platoon.
      if(action==="Hold Back"){
        const step_holds = holdCandidatesAll.filter(m=>m.shift===platoon);
        step_holds.forEach(m=>{
          const h=canHoldBack(m,projEnd);
          if(h.ok){
            colC+='<button class="obtn hold" onclick="holdBack('+m.id+',\''+iss.need+'\')" title="'+esc(noteFor(m))+'">Hold back '+esc(m.name)+' ('+esc(platoon)+') <span style="font-weight:400;font-size:11px;opacity:.75">· '+esc(noteFor(m))+'</span></button>';
            shown++;
          } else {
            excludedThisStep.push(m);
          }
        });
        step_holds.sort(rankFairness);
      } else if(action==="Call Back"){
        const step_calls = callCandidatesAll.filter(m=>m.shift===platoon).sort(rankFairness);
        step_calls.slice(0,4).forEach(m=>{
          colC+='<button class="obtn" onclick="callBack('+m.id+')" title="'+esc(noteFor(m))+'">Call back '+esc(m.name)+' ('+esc(platoon)+') <span style="font-weight:400;font-size:11px;opacity:.75">· '+esc(noteFor(m))+'</span></button>';
          shown++;
        });
      }
      // Escalate button steps the waterfall forward
      if(step < (sop?sop.order.length-1:0)){
        colC+='<button class="obtn" style="border-color:var(--amber);color:var(--amber)" onclick="escalateShortage(\''+esc(stepKey)+'\')">Escalate → '+(sop.order[step+1].platoon==="ASPSA"?"ASPSA":sop.order[step+1].platoon+" "+sop.order[step+1].action)+'</button>';
      }
    } else {
      // No SOP for this moment (shouldn't happen when a platoon is on duty) — fall back to
      // the pre-SOP behaviour: all holdback + fair callbacks.
      const okAll=[], excludedAll=[];
      holdCandidatesAll.forEach(m=>{ const h=canHoldBack(m,projEnd); (h.ok?okAll:excludedAll).push(m); });
      okAll.sort(rankFairness);
      okAll.forEach(m=>{
        colC+='<button class="obtn hold" onclick="holdBack('+m.id+',\''+iss.need+'\')" title="'+esc(noteFor(m))+'">Hold back '+esc(m.name)+' <span style="font-weight:400;font-size:11px;opacity:.75">· '+esc(noteFor(m))+'</span></button>';
        shown++;
      });
      callCandidatesAll.sort(rankFairness).slice(0,4).forEach(m=>{
        colC+='<button class="obtn" onclick="callBack('+m.id+')" title="'+esc(noteFor(m))+'">Call back '+esc(m.name)+' ('+esc(m.shift)+') <span style="font-weight:400;font-size:11px;opacity:.75">· '+esc(noteFor(m))+'</span></button>';
        shown++;
      });
      excludedThisStep.push(...excludedAll);
    }
    colC+='<button class="obtn rel" onclick="requestReliever(\''+iss.need+'\')">Request reliever</button>';
    colC+='</div>';
    if(excludedThisStep.length){
      colC+='<div style="font-size:11px;color:var(--amber);margin-top:6px">Cannot hold back (would overrun next rostered shift): '+excludedThisStep.map(m=>esc(m.name)).join(", ")+' \u2014 escalate to next relief.</div>';
    }
    if(!shown && (!currentStep || currentStep.platoon!=="ASPSA")){
      colC+='<div style="font-size:11px;color:var(--dim);margin-top:6px">No candidates from '+(currentStep?esc(currentStep.platoon)+' platoon':"any shift")+'. Escalate to the next relief.</div>';
    }
    colC+='</div>';
  });
  if(state.relieverReqs.length){
    colC+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+state.relieverReqs.map((r,i)=>'<button class="tag q" style="font-size:11px;cursor:pointer;background:none" title="Tap to clear" onclick="dismissRelieverReq('+i+')">Reliever requested · '+esc(r.need)+' · '+fmt(r.at)+' ✕</button>').join("")+'</div>';
  }
  colC+='</div></div>';

  // Holdbacks / Callbacks / OT
  const hb = state.members.filter(m=>m.status==="on" && (m.ot||m.excHours));
  colC+='<div class="panel"><div class="hd"><span>OT &amp; standby swaps</span>'+(hb.length?'<span>'+hb.length+'</span>':'')+'</div><div class="bd">';
  if(!hb.length) colC+='<div class="empty-note">No one on OT or a standby swap. Off-shift arrivals are auto-flagged from board state, not the clock: Holdback if still on from the shift that just came off, Callback if they fill an empty seat or release a holdback (called in to fix a shortfall, whatever the time), Standby if they relieve someone on an otherwise-covered board (pre-arranged swap, not OT). External relievers get no flag. Select a member to change any flag.</div>';
  hb.forEach(m=>{
    const where = m.seatId ? seatById(m.seatId).truckName+" "+seatById(m.seatId).label : "standby";
    const home = m.shift!==active ? " · "+m.shift+" shift" : "";
    colC+='<div class="hbrow"><div><b>'+esc(m.name)+'</b> <span class="sbsub">'+where+home+'</span>'+
      (m.ot==="Holdback"?'<div style="font-size:12px;color:var(--amber);font-weight:700">Holdback · OT</div>':'')+
      (m.ot==="Super holdback"?'<div style="font-size:12px;color:var(--red);font-weight:800">SUPER HOLDBACK · working through, released from next rostered shift'+(m.superHBKey?' ('+esc(m.superHBKey)+')':'')+'</div>':'')+
      (m.ot==="Callback"?'<div style="font-size:12px;color:var(--amber);font-weight:700">Callback · OT</div>':'')+
      (m.ot==="Standby"?(function(){
        let sbLine='<div style="font-size:12px;color:var(--green);font-weight:700">Standby · shift-for-shift swap, not OT</div>';
        if(m.coveringFor){
          const cv=state.members.find(x=>x.id===m.coveringFor);
          if(cv){
            const stat = cv.avail!=="Available" ? " · "+cv.avail : "";
            sbLine+='<div style="margin-top:4px;font-size:12px">Covering <b>'+esc(cv.name)+'</b> ('+esc(cv.shift)+' shift'+esc(stat)+') · '+esc(cv.name)+' owes '+esc(m.name)+' one <span class="sbbadge pos">ledger ✓</span> <button class="obtn" onclick="setCoveringFor('+m.id+',0)" style="border-color:var(--faint);color:var(--dim);margin-left:4px">clear</button></div>';
          }
        } else {
          let opts='<option value="">Covering for\u2026</option>';
          SHIFTS.forEach(sh=>{
            const g=state.members.filter(x=>x.shift===sh && x.id!==m.id).sort((a,b)=>a.name.localeCompare(b.name));
            if(!g.length) return;
            opts+='<optgroup label="'+sh+' shift">';
            g.forEach(x=>{ const stat=x.avail!=="Available"?" · "+x.avail:""; opts+='<option value="'+x.id+'">'+esc(x.name)+esc(stat)+'</option>'; });
            opts+='</optgroup>';
          });
          sbLine+='<div style="margin-top:4px"><select class="searchbox" style="margin:0;font-size:12px;padding:4px 6px" onchange="setCoveringFor('+m.id+',this.value)">'+opts+'</select></div>';
        }
        return sbLine;
      })():'')+
      (m.excHours?'<div style="font-size:12px;color:var(--blue);font-weight:700">Excessive hours · excused next night shift, still paid</div>':'')+
      '</div></div>';
  });
  colC+='</div></div>';

  // Shift message
  if(showShiftMsg){
    colC+='<div class="panel"><div class="hd"><span>Shift message</span><button class="offbtn" onclick="toggleShiftMsg()">Close</button></div><div class="bd">';
    colC+='<textarea class="msgbox" readonly onclick="this.select()">'+esc(generateShiftMessage(state.members))+'</textarea>';
    colC+='<div style="display:flex;gap:8px;margin-top:8px"><button class="ctl warn" onclick="copyShiftMsg()">Copy</button><button class="ctl" onclick="toggleShiftMsg()">Done</button></div>';
    colC+='<div class="note" style="margin-top:8px">Auto-built from the current board. Paste into your shift channel. The relieving line hands off to the relieving tracker for who actually gets sent out.</div>';
    colC+='</div></div>';
  }

  colC+='<div class="panel"><div class="hd"><span>Board controls</span></div><div class="bd">';
  colC+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  colC+='<button class="ctl warn" onclick="toggleShiftMsg()">Shift message</button>';
  colC+='<button class="ctl" onclick="window.print()">Print / handover</button>';
  colC+= rehearsal
    ? '<button class="ctl warn" onclick="exitRehearsal()">Exit rehearsal</button>'
    : '<button class="ctl" onclick="enterRehearsal()" title="Play through a shift changeover without saving anything">Rehearse changeover</button>';
  if(!rehearsal){
    colC+='<button class="ctl" onclick="clearBoard()" title="Clear on-duty state for a new shift. Keeps roster, tags, forecast notes.">New shift</button>';
    colC+='<button class="ctl" onclick="exportJSON()">Export backup</button>';
    colC+='<label class="ctl" style="display:inline-flex;align-items:center">Import<input type="file" accept="application/json" style="display:none" onchange="importJSON(event)"></label>';
    colC+='<button class="ctl danger" onclick="fullReset()">Full reset</button>';
  }
  colC+='</div>';
  colC+='<div class="note">Runs on this device only — Export before clearing browser data. Concept demonstrator.</div>';
  colC+='</div></div></div>';

  document.getElementById("view-board").innerHTML=colA+colB+colC;
}

function selectMember(id){ selectedId = (selectedId===id?null:id); render(); }

function renderForecast(){
  const target = forecastTarget || defaultForecastTarget();
  const iso = target.iso, phase = target.phase;
  const platoon = forecastPlatoon(iso, phase);
  const sos = forecastShiftOfSet(iso, phase) || "";
  const startMs = forecastShiftStartMs(iso, phase);
  const targetD = new Date(startMs);
  const dateLbl = targetD.toLocaleDateString([], {weekday:"long", day:"2-digit", month:"short", year:"numeric"});

  // Members rostered for this shift + who is projected off (with reason).
  const rostered = state.members.filter(m => m.shift===platoon);
  const projected = rostered.map(m => {
    const reason = forecastUnavailableReason(m, startMs);
    return { m, reason };
  });
  const available = projected.filter(x => !x.reason);
  const unavailable = projected.filter(x =>  x.reason);
  const holdbackNotes = state.members.filter(m => m.forecastHoldback);

  // Rough shortfall check: count how many members can cover each need vs. requirement.
  const need = k => available.filter(x => coversNeed(x.m, k)).length;
  const rows = [
    ["SO seats (2)",         2, available.filter(x => x.m.rank==="SO").length],
    ["CLP holders (2)",      2, need("CLP")],
    ["VR holders (6)",       6, need("VR")],
    ["Total available",     10, available.length]
  ];

  // The SOP order for this forecast target.
  const sopFC = forecastShortageOrder(iso, phase);
  const noteFor = m => m.lastOT ? "last OT "+new Date(m.lastOT).toLocaleDateString([], {day:"2-digit",month:"short"}) : "no OT recorded";

  let h = '<div style="max-width:1200px;margin:0 auto;padding:16px 20px">';
  h += '<div style="font-size:11px;font-weight:800;letter-spacing:2px;color:var(--faint);margin-bottom:6px">FORECAST · WHAT DOES THE NEXT SHIFT LOOK LIKE</div>';
  h += '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px">';
  h += '<input type="date" value="'+esc(iso)+'" onchange="forecastTarget={iso:this.value,phase:\''+esc(phase)+'\'};render()" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:inherit;font-weight:700">';
  h += '<span style="display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden">';
  h += '<button class="ctl'+(phase==="Day"?" warn":"")+'" style="border-radius:0;border:0" onclick="forecastTarget={iso:\''+esc(iso)+'\',phase:\'Day\'};render()">Day</button>';
  h += '<button class="ctl'+(phase==="Night"?" warn":"")+'" style="border-radius:0;border:0;border-left:1px solid var(--line)" onclick="forecastTarget={iso:\''+esc(iso)+'\',phase:\'Night\'};render()">Night</button>';
  h += '</span>';
  h += '<button class="ctl" onclick="forecastTarget=null;render()">Reset to next shift</button>';
  const expOffCount = state.members.filter(m=>m.expectedOff).length;
  if(expOffCount) h += '<button class="ctl warn" onclick="clearAllExpectedOff()">Clear all Expected off ('+expOffCount+')</button>';
  h += '<span style="color:var(--dim);font-size:13px">'+esc(dateLbl)+' · <b style="color:var(--text)">'+esc(platoon)+' PLATOON</b> · '+esc(sos.toUpperCase()||"?")+'</span>';
  h += '</div>';

  // Roster panel
  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
  h += '<div class="panel"><div class="hd"><span>Rostered available ('+available.length+')</span></div><div class="bd">';

         '<button class="ctl" style="font-size:11px;padding:3px 8px" onclick="promptBookedOff('+m.id+')">Booked off (PSL etc)</button>'+

         '</div>';

  h += '<div class="panel"><div class="hd"><span>Projected off ('+unavailable.length+')</span></div><div class="bd">';
  if(!unavailable.length) h += '<div class="empty-note">Everyone on this shift is projected available.</div>';

    const clearBtn = m.expectedOff ? '<button class="ctl" style="font-size:11px;padding:2px 8px;margin-left:6px" onclick="toggleExpectedOff('+m.id+')">Clear</button>' : '';

  });
  h += '</div></div>';
  h += '</div>';

  // Coverage panel — qual-aware rows + the authoritative crew-solve feasibility answer.
  const fcCov = forecastCoverage(iso, phase);
  const feas = forecastFeasibility(iso, phase);
  h += '<div class="panel" style="margin-top:16px"><div class="hd"><span>Coverage check</span></div><div class="bd">';
  h += '<div style="display:flex;gap:14px;flex-wrap:wrap">';
  fcCov.rows.forEach(r => {
    const ok = r.key==="VR" ? fcCov.vrB.met : r.have >= r.req;

  });
  h += '</div>';
  if(feas.ok){
    h += '<div style="margin-top:12px;padding:10px 12px;background:var(--panel);border-left:3px solid var(--green);border-radius:5px;font-size:13px;color:var(--green);font-weight:700">A fully legal board can be built from the projected crew. No holdback needed on current information.</div>';
  } else {
    h += '<div style="margin-top:12px;padding:10px 12px;background:var(--panel);border-left:3px solid var(--red);border-radius:5px;font-size:13px"><b style="color:var(--red)">HOLDBACK / CALLBACK NEEDED — required: </b>'+feas.missing.map(esc).join("; ")+'.<br><span style="color:var(--dim);font-size:12px">The off-going crew\'s holdback (or a callback per the SOP below) must hold the qualification named, or the next shift starts down.</span></div>';
  }
  h += '</div></div>';

  // SOP matrix hint for this shift + fairness-ranked candidates for holdback / callback
  if(sopFC){
    h += '<div class="panel" style="margin-top:16px"><div class="hd"><span>SOP matrix · '+esc(platoon)+' PLATOON · '+esc(sos.toUpperCase())+'</span></div><div class="bd">';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12px">';
    sopFC.order.forEach((s, i) => {
      const label = s.platoon==="ASPSA" ? "ASPSA" : s.platoon+" "+s.action;
      h += '<span style="padding:4px 10px;border-radius:4px;font-weight:700;letter-spacing:.5px;background:var(--panel);color:var(--dim);border:1px solid var(--line)">'+(i+1)+' · '+esc(label)+'</span>';
    });
    h += '</div>';
    // Deliberately NO named candidates here. A forecast designates what's REQUIRED —
    // the quals and which platoon per SOP — never who. Naming people days ahead reads
    // as pre-assigning overtime that hasn't been offered; the who is decided live, on
    // the day, on the Shortfalls panel with the fairness order.
    if(!feas.ok){
      h += '<div style="font-size:13px;color:var(--dim);margin-bottom:6px">Required to cover the projected gap: <b style="color:var(--text)">'+feas.missing.map(esc).join("; ")+'</b>. Source per SOP order above — who goes is decided on the day.</div>';
    } else {
      h += '<div style="font-size:12px;color:var(--faint)">No projected gap. The order above applies only if a shortfall emerges.</div>';
    }
    h += '</div></div>';
  }

  // Forecast holdback summary (if any)
  if(holdbackNotes.length){
    h += '<div class="panel" style="margin-top:16px"><div class="hd"><span>All forecast holdbacks</span><span>'+holdbackNotes.length+'</span></div><div class="bd">';
    h += '<div class="note" style="margin-bottom:8px">These appear on the live board when their shift becomes current, so the SO knows to release them first.</div>';
    holdbackNotes.forEach(m => {
      h += '<div class="qrow"><span><b>'+esc(m.name)+'</b> ('+esc(m.shift)+') · '+esc(m.forecastHoldback)+'</span><button class="ctl" style="font-size:11px;padding:3px 8px" onclick="setForecastHoldback('+m.id+',\'\')">Clear</button></div>';
    });
    h += '</div></div>';
  }

  h += '<div class="note" style="margin-top:20px">Forecast is a preview only. Nothing here changes the live board or the roster — flip the actual availability in the Roster tab if a leave/relief block is coming up. Forecast holdback notes persist until cleared or the board is cleared for a new shift.</div>';
  h += '</div>';
  document.getElementById("view-forecast").innerHTML = h;
}


// ============ SAMS day-sheet paste importer ============
// Parses a copy-paste of the SAMS rostered/on-shift table and maps each row to a roster
// member and an availability status. PRIVACY: staff numbers and overtime claim / relief
// payment receipt numbers appear in the paste; they are parsed PAST and never stored,
// previewed, or exported — the board carries paper-duty-board information only.
let samsPreview = null; // { rows:[{name, matchedId, matchedName, code, newStatus, note}], skipped:[...] }
const SAMS_CODE_MAP = {
  "AL":"Annual leave", "LSL":"LSL", "PSL":"Sick", "SICK":"Sick",
  "REL":"Relieving out",
  "P":"Available", "P(REL)":"Available", "ACT":"Available", "HB":"Available"
};
// Precedence when the same person appears in multiple rows (e.g. present here as a
// reliever AND posted out at their substantive): being present here wins.
const SAMS_CODE_RANK = { "P":0, "P(REL)":0, "HB":0, "ACT":1, "PSL":2, "SICK":2, "AL":3, "LSL":3, "REL":4 };
function parseSAMSPaste(text){
  const rows = [], skipped = [];
  const seen = {}; // surname+initial -> row index in rows (for precedence)
  text.split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if(!t) return;
    if(/^Rostered|^\s*Name\s|^Submitted by|^Last edited|^Special Relief/i.test(t)){ 
      if(/^Special Relief/i.test(t)) skipped.push({line:t, why:"note (shown, not imported)"});
      return; 
    }
    if(/^vacant\b/i.test(t)){ return; } // vacant positions carry nothing for the board
    const cols = line.split("\t").map(c=>c.trim());
    if(cols.length < 4) { skipped.push({line:t.slice(0,60), why:"unrecognised line"}); return; }
    // Name cell: "Surname, First Middle (RANK)(Class)" — take surname + first initial.
    const nameCell = cols[0];
    const nm = nameCell.match(/^([^,]+),\s*([A-Za-z])/);
    if(!nm){ skipped.push({line:t.slice(0,60), why:"no parsable name"}); return; }
    const surname = nm[1].trim(), initial = nm[2].toUpperCase();
    // Rank tags for info only (matching is by name; the board already knows ranks)
    const isDO = /\(DO\)/.test(nameCell);
    // Code: SAMS puts it in column 3 (after staff# and start time). Guard against column
    // drift by searching the first several cells for a known code.
    let code = null;
    for(let i=2;i<Math.min(cols.length,6);i++){
      const c = cols[i].toUpperCase();
      if(SAMS_CODE_MAP[c] !== undefined){ code = c; break; }
    }
    if(!code){ skipped.push({line:surname+", "+initial+".", why:"no status code found"}); return; }
    if(isDO){ skipped.push({line:surname+", "+initial+". (DO)", why:"District Officer — not on the station board"}); return; }
    const key = surname.toLowerCase()+"|"+initial;
    const newStatus = SAMS_CODE_MAP[code];
    // Match against the roster: surname + first initial (board names are "Surname, I.")
    const member = state.members.find(m => {
      const mm = m.name.match(/^([^,]+),\s*([A-Za-z])/);
      return mm && mm[1].trim().toLowerCase()===surname.toLowerCase() && mm[2].toUpperCase()===initial;
    });
    const row = {
      name: surname+", "+initial+".",
      matchedId: member ? member.id : null,
      matchedName: member ? member.name : null,
      currentStatus: member ? member.avail : null,
      code, newStatus,
      note: code==="HB" ? "holdback on the sheet — flag OT on the board separately" : (code==="REL" ? "posted out relieving" : "")
    };
    if(key in seen){
      // precedence: keep whichever row ranks lower (more "present here")
      const prior = rows[seen[key]];
      if((SAMS_CODE_RANK[code] ?? 9) < (SAMS_CODE_RANK[prior.code] ?? 9)) rows[seen[key]] = row;
    } else {
      seen[key] = rows.length;
      rows.push(row);
    }
  });
  return { rows, skipped };
}
function samsParseAction(){
  const ta = document.getElementById("samsPaste");
  if(!ta || !ta.value.trim()){ say("Paste the SAMS table into the box first.","warn"); return; }
  samsPreview = parseSAMSPaste(ta.value);
  const matched = samsPreview.rows.filter(r=>r.matchedId).length;
  say("Parsed "+samsPreview.rows.length+" people ("+matched+" matched to the roster). Review below, then Apply.","info");
  render();
}
function samsApplyAction(){
  if(!samsPreview) return;
  let changed = 0;
  samsPreview.rows.forEach(r => {
    if(!r.matchedId) return;
    const m = state.members.find(x=>x.id===r.matchedId);
    if(m && m.avail !== r.newStatus){ m.avail = r.newStatus; changed++; }
  });
  say("SAMS import applied — "+changed+" status"+(changed===1?"":"es")+" updated. Staff numbers and claim numbers were discarded, not stored.","ok");
  samsPreview = null;
  commit();
}
function samsCancelAction(){ samsPreview = null; render(); }

    if(sos.length){
      h+='<div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--faint);margin-bottom:3px">OFFICERS</div>';

      h+='<div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--faint);margin:6px 0 3px">FIREFIGHTERS</div>';
      ffs.forEach((m,i)=>{ h+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0'+(i===0?';color:var(--green);font-weight:700':'')+'"><span>'+(i+1)+'. '+esc(m.name)+'</span><span>'+esc(otFmt(m))+'</span></div>'; });
    }
    h+='</div>';
  });
  h+='</div></details>';

  h+='<textarea id="samsPaste" style="width:100%;min-height:90px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font-family:inherit;font-size:12px" placeholder="Paste the SAMS table here…"></textarea>';
  h+='<div style="display:flex;gap:8px;margin-top:6px"><button class="ctl warn" onclick="samsParseAction()">Parse</button>'+(samsPreview?'<button class="ctl" style="border-color:var(--green);color:var(--green)" onclick="samsApplyAction()">Apply '+samsPreview.rows.filter(r=>r.matchedId).length+' matched</button><button class="ctl" onclick="samsCancelAction()">Discard</button>':'')+'</div>';
  if(samsPreview){
    h+='<div style="margin-top:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden">';
    samsPreview.rows.forEach(r=>{
      const chg = r.matchedId && r.currentStatus!==r.newStatus;
      h+='<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;'+(r.matchedId?'':'opacity:.5')+'">';

      h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
      h+='<select onchange="setShift('+m.id+',this.value)">'+SHIFTS.map(s=>'<option'+(m.shift===s?' selected':'')+'>'+s+'</option>').join("")+'</select>';
      h+='<select onchange="setAvail('+m.id+',this.value)">'+STATUSES.map(s=>'<option'+(m.avail===s?' selected':'')+'>'+s+'</option>').join("")+'</select>';
      h+='</div></div>';
      h+='<div class="togs">';
      if(m.rank!=="SO") h+='<button class="tog'+(m.rank==="SFF"?" on":"")+'" onclick="toggleSenior('+m.id+')">SENIOR</button>';
      [["topo","TOPO"],["stripe","STRIPE"],["clp","CLP"],["vr","VR"],["csr","CSR"],["rrs","RRS"],["reliever","RELIEVER"]].forEach(([k,l])=>{
        h+='<button class="tog'+(m[k]?" on":"")+'" onclick="toggleTag('+m.id+',\''+k+'\')">'+l+'</button>';
      });
      h+='</div>';
      h+='<input class="noteinput" placeholder="Acting as / note (e.g. Acting DO, Academy instructor)" value="'+esc(m.note||"")+'" onchange="setNote('+m.id+',this.value)">';
      h+='</div>';
    });
    h+='</details>';
  });
  const rels = state.members.filter(m=>m.ext&&rmatch(m));
  if(rels.length){
    h+='<div class="shifthdr">EXTERNAL RELIEVERS</div>';
    rels.forEach(m=>{
      h+='<div class="rmember"><div class="rtop"><div><span class="rname">'+esc(m.name)+'</span> <span class="rrank">'+esc(m.rank==="FF"?(m.cls||"Reliever"):m.rank)+' · from another station</span></div>';
      h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
      h+='<select onchange="setAvail('+m.id+',this.value)">'+STATUSES.map(s=>'<option'+(m.avail===s?' selected':'')+'>'+s+'</option>').join("")+'</select>';
      h+='<button class="ctl danger" onclick="removeReliever('+m.id+')">Remove</button>';
      h+='</div></div>';
      h+='<div class="togs">';
      if(m.rank!=="SO") h+='<button class="tog'+(m.rank==="SFF"?" on":"")+'" onclick="toggleSenior('+m.id+')">SENIOR</button>';
      [["topo","TOPO"],["stripe","STRIPE"],["clp","CLP"],["vr","VR"],["csr","CSR"],["rrs","RRS"]].forEach(([k,l])=>{
        h+='<button class="tog'+(m[k]?" on":"")+'" onclick="toggleTag('+m.id+',\''+k+'\')">'+l+'</button>';
      });
      h+='</div></div>';
    });
  }
  h+='</div></div></div>';
  document.getElementById("view-roster").innerHTML=h;
}

  const q=sbQuery.trim().toLowerCase();
  h+='<div class="col">';
  h+='<div class="panel"><div class="hd"><span>Standby ledger · pick a name</span></div><div class="bd">';
  h+='<input class="searchbox" placeholder="Search a name…" value="'+esc(sbQuery)+'" oninput="setSbQuery(this.value)">';
  const groups = SHIFTS.map(sh=>({label:sh+" shift", rows:state.members.filter(m=>m.shift===sh).map(m=>({key:"m:"+m.id, label:m.name, sub:m.shift}))}))
    .concat([{label:"External relievers on the board", rows:state.members.filter(m=>m.ext).map(m=>({key:"m:"+m.id, label:m.name, sub:"reliever"}))}]);
  // external parties that only exist in the ledger (other stations)
  const extSeen=new Map();
  state.standbys.forEach(s=>{ [s.coverer,s.coveree].forEach(p=>{ if(isExt(p)) extSeen.set(partyKey(p), p); }); });
  if(extSeen.size){
    groups.push({label:"Other stations", rows:[...extSeen.values()].map(p=>({key:partyKey(p), label:partyLabel(p), sub:p.s||"other station"}))});
  }
  let any=false;
  groups.forEach(g=>{
    const rows=g.rows.filter(r=>!q||r.label.toLowerCase().includes(q)).sort((a,b)=>a.label.localeCompare(b.label));
    if(!rows.length) return;
    any=true;
    h+='<div class="grouplbl">'+g.label+'</div>';
    rows.forEach(r=>{
      const bal=personBalances(r.key);
      const owesTot=bal.owes.reduce((a,b)=>a+b.n,0);
      const owedTot=bal.owed.reduce((a,b)=>a+b.n,0);
      let badge='';
      if(owedTot) badge+='<span class="sbbadge pos">+'+owedTot+'</span>';
      if(owesTot) badge+='<span class="sbbadge neg">-'+owesTot+'</span>';
      const on = sbStaff===r.key;
      h+='<button class="staffrow'+(on?' on':'')+'" onclick="selectStaff(\''+r.key+'\')"><span>'+esc(r.label)+'</span><span>'+badge+'</span></button>';
    });
  });
  if(!any) h+='<div class="empty-note">No match.</div>';
  h+='</div></div></div>';

  // RIGHT: selected party's standing
  h+='<div class="col">';
  if(!sbStaff){
    h+='<div class="panel"><div class="hd"><span>Standby position</span></div><div class="bd"><div class="empty-note">Pick a name to see who they owe standbys to, who owes them, and to log or reconcile standbys. Standbys done at other stations can be logged against an external name.</div></div></div>';
  } else {
    const selParty = resolveParty(sbStaff);
    const name = partyLabel(selParty);
    const bal=personBalances(sbStaff);
    h+='<div class="panel"><div class="hd"><span>'+esc(name)+'</span><span>'+esc(partySub(selParty))+'</span></div><div class="bd">';

    h+='<div class="grouplbl neg">'+esc(name)+' owes standbys to</div>';
    if(!bal.owes.length) h+='<div class="empty-note">Owes no one.</div>';
    bal.owes.forEach(d=>{
      h+='<div class="sbrel"><span><b>'+esc(partyLabel(d.party))+'</b> <span class="sbsub">'+esc(partySub(d.party))+'</span></span><span class="sbcount neg">'+d.n+'</span><button class="obtn hold" onclick="reconcilePayback(\''+sbStaff+'\',\''+d.key+'\')">Paid one back</button></div>';
    });

    h+='<div class="grouplbl pos" style="margin-top:12px">Has covered for · owed back by</div>';
    if(!bal.owed.length) h+='<div class="empty-note">No one owes '+esc(name)+'.</div>';
    bal.owed.forEach(d=>{
      h+='<div class="sbrel"><span><b>'+esc(partyLabel(d.party))+'</b> <span class="sbsub">'+esc(partySub(d.party))+'</span></span><span class="sbcount pos">'+d.n+'</span><button class="obtn rel" onclick="reconcileRepaid(\''+sbStaff+'\',\''+d.key+'\')">They repaid one</button></div>';
    });

    // log new, with member OR external counterpart
    h+='<div class="grouplbl" style="margin-top:14px">Log a standby involving '+esc(name)+'</div>';
    h+='<div style="display:flex;gap:6px;margin-bottom:8px">';
    h+='<button class="tog'+(sbMode==="member"?" on":"")+'" onclick="sbSetMode(\'member\')">Perth member</button>';
    h+='<button class="tog'+(sbMode==="ext"?" on":"")+'" onclick="sbSetMode(\'ext\')">Another station</button>';
    h+='</div>';
    if(sbMode==="member"){
      h+='<select class="searchbox" style="margin-bottom:8px" onchange="sbPickSet(this.value)">'+standbyPickOptions()+'</select>';
    } else {
      h+='<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">';
      h+='<input class="searchbox" style="margin:0;flex:2 1 140px" placeholder="Their name (e.g. Bain)" value="'+esc(sbExtName)+'" oninput="sbExtField(\'name\',this.value)">';
      h+='<input class="searchbox" style="margin:0;flex:1 1 120px" placeholder="Station (e.g. Ellenbrook)" value="'+esc(sbExtStn)+'" oninput="sbExtField(\'stn\',this.value)">';
      h+='</div>';
    }
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
    h+='<button class="ctl warn" onclick="logForStaff(\'did\')">'+esc(name)+' covered for them</button>';
    h+='<button class="ctl warn" onclick="logForStaff(\'got\')">They covered for '+esc(name)+'</button>';
    h+='</div>';
    h+='</div></div>';
  }
  h+='</div>';

  // FULL LOG
  h+='<div class="col" style="grid-column:1/-1">';
  h+='<div class="panel"><div class="hd"><span>Full standby log</span><span>'+state.standbys.length+'</span></div><div class="bd">';
  if(!state.standbys.length) h+='<div class="empty-note">Nothing logged yet.</div>';
  state.standbys.forEach(s=>{
    const rec = s.note==="payback";
    h+='<div class="ledgerrow"><div><b>'+esc(partyLabel(s.coverer))+'</b> covered for <b>'+esc(partyLabel(s.coveree))+'</b>'+(rec?' <span class="sbbadge pos">reconcile</span>':(s.note?' · '+esc(s.note):''))+'<div class="sbsub">'+esc(s.date)+'</div></div><button class="obtn" style="border-color:var(--faint);color:var(--dim)" onclick="deleteStandby('+s.id+')">Remove</button></div>';
  });
  h+='</div></div></div>';

  h+='</div>';
  document.getElementById("view-standby").innerHTML=h;
}

function standbyPickOptions(){
  let o='<option value="">Select a Perth member…</option>';
  const selId = sbStaff&&sbStaff.startsWith("m:") ? parseInt(sbStaff.slice(2),10) : null;
  SHIFTS.forEach(sh=>{
    const g=state.members.filter(m=>m.shift===sh && m.id!==selId).sort((a,b)=>a.name.localeCompare(b.name));
    if(!g.length) return;
    o+='<optgroup label="'+sh+' shift">';
    g.forEach(m=>{ o+='<option value="'+m.id+'"'+(String(sbPick)===String(m.id)?' selected':'')+'>'+esc(m.name)+'</option>'; });
    o+='</optgroup>';
  });
  const rels=state.members.filter(m=>m.ext && m.id!==selId);
  if(rels.length){ o+='<optgroup label="External relievers">'; rels.forEach(m=>{ o+='<option value="'+m.id+'"'+(String(sbPick)===String(m.id)?' selected':'')+'>'+esc(m.name)+'</option>'; }); o+='</optgroup>'; }
  return o;
}

function renderBar(sel){
  const bar=document.getElementById("actionbar");
  if(promptBox){
    bar.innerHTML='<div class="bar"><div style="flex:1;min-width:220px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">'+esc(promptBox.text)+'</div><input class="searchbox" style="margin:0" type="'+esc(promptBox.inputType)+'" autofocus placeholder="'+esc(promptBox.placeholder)+'" value="'+esc(promptBox.value)+'" oninput="setPromptValue(this.value)" onkeydown="if(event.key===\'Enter\')promptSubmit()"></div><div style="display:flex;gap:8px"><button class="ctl warn" onclick="promptSubmit()">'+esc(promptBox.submitLabel)+'</button><button class="ctl" onclick="promptCancel()">Cancel</button></div></div>';
    return;
  }
  if(confirmBox){
    bar.innerHTML='<div class="bar danger"><div><div style="font-size:14px;font-weight:800">'+esc(confirmBox.text)+'</div><div class="issues">'+confirmBox.issues.map(i=>'<div>• '+esc(i)+'</div>').join("")+'</div></div><div style="display:flex;gap:8px"><button class="ctl danger" onclick="confirmYes()">Force it</button><button class="ctl" onclick="confirmNo()">Cancel</button></div></div>';
    return;
  }
  if(sel){
    const tOn = sel.signOn?new Date(sel.signOn):new Date();
    const hhmm = String(tOn.getHours()).padStart(2,"0")+":"+String(tOn.getMinutes()).padStart(2,"0");
    const timeEd = sel.status==="on" ? '<span class="ctl" style="display:inline-flex;align-items:center;gap:6px;cursor:default">On <input type="time" value="'+hhmm+'" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-family:inherit" onchange="setSignOnTime('+sel.id+',this.value)"></span>' : '';
    const staying = sel.status==="on" && canRelieveOut(sel);
    const stayBtn = staying ? '<button class="ctl'+(sel.staying?' warn':'')+'" onclick="toggleStaying('+sel.id+')">'+(sel.staying?"Staying ✓":"Mark staying")+'</button>' : '';
    // Build the button row first — closes the flex row div only (leaves outer .bar open)
    bar.innerHTML='<div class="bar"><div style="font-size:14px;font-weight:700">'+esc(sel.name)+' selected <span style="color:var(--faint);font-weight:500">· tap a seat to move / swap</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+timeEd+stayBtn+(sel.status==="on"?'<button class="ctl'+(sel.ot==="Holdback"?' warn':'')+'" onclick="toggleOT('+sel.id+',\'Holdback\')">Holdback</button><button class="ctl'+(sel.ot==="Callback"?' warn':'')+'" onclick="toggleOT('+sel.id+',\'Callback\')">Callback</button><button class="ctl'+(sel.ot==="Super holdback"?' warn':'')+'" onclick="toggleOT('+sel.id+',\'Super holdback\')" title="Held back all through the next shift; released from the shift after">Super holdback</button><button class="ctl'+(sel.ot==="Standby"?' warn':'')+'" onclick="toggleOT('+sel.id+',\'Standby\')">Standby</button><button class="ctl'+(sel.excHours?' warn':'')+'" onclick="toggleExcHours('+sel.id+')">'+(sel.excHours?"Exc hrs ✓":"Excess hrs")+'</button>'+(!sel.seatId?'<button class="ctl" onclick="relieveNextOut('+sel.id+')">Relieve next out</button>':'')+(!sel.seatId&&canRelieveOut(sel)?'<button class="ctl warn" onclick="sendRelieving('+sel.id+')">Send relieving</button>':'')+'<button class="ctl" onclick="removeMistap()" title="Undo a mistaken sign-on — no attendance record, no OT tally hit">Remove (mis-tap)</button><button class="ctl warn" onclick="releaseSelected()">Release off duty</button>':'')+'<button class="ctl" onclick="selectMember('+sel.id+')">Cancel</button></div>';
    // Send-relieving picker: appears inline inside the same .bar wrapper when in progress.
    if(relievingOutPicker && relievingOutPicker.memberId===sel.id){
      const shiftEnd = currentShiftEndMs();
      const shiftEndLabel = new Date(shiftEnd).getHours()===8 ? "08:00" : "18:00";
      const today = nowDate();
      const iso = new Date(today.getFullYear(), today.getMonth(), today.getDate()+1).toISOString().slice(0,10);
      bar.innerHTML+='<div style="margin-top:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--amber);border-radius:6px"><div style="font-weight:800;letter-spacing:1px;font-size:12px;color:var(--amber);margin-bottom:6px">SENDING '+esc(sel.name)+' RELIEVING — BACK WHEN?</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<button class="ctl" onclick="commitSendRelieving('+sel.id+','+shiftEnd+')">This shift only (back '+shiftEndLabel+')</button>'+
        '<span class="ctl" style="display:inline-flex;align-items:center;gap:6px;cursor:default">Pick date <input type="date" value="'+(relievingOutPicker.dateVal||iso)+'" onchange="setRelievingOutDate(this.value)" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-family:inherit" id="rodate"><button class="ctl warn" onclick="commitSendRelievingFromDate('+sel.id+')">Set</button></span>'+
        '<button class="ctl" onclick="commitSendRelieving('+sel.id+',0)" title="Old behaviour — persists until manually cleared on the roster">Indefinite</button>'+
        '<button class="ctl" onclick="cancelSendRelieving()">Cancel</button>'+
      '</div><div class="note" style="margin:6px 0 0">This shift only auto-clears at '+shiftEndLabel+'. Pick date auto-clears at 08:00 on that day.</div></div>';
    }
    // Close the outer .bar wrapper exactly once
    bar.innerHTML+='</div>';
    return;
  }
  bar.innerHTML="";
}
function confirmYes(){ if(confirmBox){ const f=confirmBox.onConfirm; confirmBox=null; f(); } }
function confirmNo(){ confirmBox=null; render(); }

// In-app text prompt — see the promptBox declaration for why this replaces window.prompt().
function openPrompt(text, placeholder, onSubmit, opts){
  opts = opts || {};
  promptBox = { text, placeholder: placeholder||"", value: opts.value||"", inputType: opts.inputType||"text", submitLabel: opts.submitLabel||"OK", onSubmit, onCancel: opts.onCancel||null };
  render();
}
function setPromptValue(v){ if(promptBox) promptBox.value = v; }
function promptSubmit(){
  if(!promptBox) return;
  const f = promptBox.onSubmit, v = promptBox.value;
  promptBox = null;
  f(v);
}
function promptCancel(){
  if(!promptBox) return;
  const f = promptBox.onCancel;
  promptBox = null;
  render();
  if(f) f();
}

// Live clock. The 1s tick just rewrites the two visible time nodes — no re-render, so it
// doesn't fight typing or blow the cost up. A full render only fires when the calendar day
// changes or the rotation clock crosses 06:00 / 08:00 / 16:00 / 18:00 (phase, on-duty shift,
// or incoming/on transition), so the "ON NOW" line and the green nowdot follow reality.
let lastPhase = null, lastOnShift = null, lastDate = null;
function tickClock(){
  const now = nowDate();
  const t = fmt(now.getTime());
  const nt = document.getElementById("nowtime"); if(nt) nt.textContent = t;
  const sc = document.getElementById("stripclock"); if(sc) sc.textContent = t;
  const duty = currentDuty(now);
  const dstr = now.toDateString();
  if(lastPhase===null){ lastPhase=duty.phase; lastOnShift=duty.shift; lastDate=dstr; return; }
  if(duty.phase!==lastPhase || duty.shift!==lastOnShift || dstr!==lastDate){
    lastPhase=duty.phase; lastOnShift=duty.shift; lastDate=dstr;
    render();
    return;
  }
  // Also re-render if any release note just expired, so cards disappear on time.
  if(pruneReleases()) render();
}
setInterval(tickClock, 1000);
setInterval(()=>{ if(tab==="board") render(); }, 30000);
render();
</script>
<script>
"use strict";
/* ============================================================
   Live shared board via Firebase (Firestore) — optional, additive.
   Everything here is layered on top of the local-only board above:
   local flows (localStorage, undo, rehearsal, SAMS import, exports)
   are untouched, and every local write still lands in localStorage
   exactly as before. When Firebase is unset, unreachable, offline,
   or this is opened over file://, this block quietly does nothing
   and the board behaves exactly as it did before this file existed.

   Sync model: a single board doc (boards/perth) with a rev counter.
   On write we transact — refuse to clobber a rev newer than the one
   we last read, and on conflict reload the authoritative board and
   tell the user to redo their change. Reads refresh on load and on
   tab visibilitychange. Writes are gated behind a station PIN, hashed
   before it ever leaves the device, cached per-device after the first
   correct entry.
   ============================================================ */
const FB_PIN_KEY = "perth-eduty-pin-v1";
const FB_SDK = "10.14.1";
// Testing-phase switch: while false, any device can write to the live board with no PIN
// prompt at all. Flip to true once the board goes out to the crew for real — the PIN
// prompt, hashing and per-device caching are all already wired up, this just bypasses them.
const FB_REQUIRE_PIN = false;
let fbEnabled = false;      // SDK loaded, config valid, at least one read has succeeded
let fbDb = null, fbDocRef = null, fbFns = null;
let fbRev = 0;               // last known remote revision (baseline for our next write)
let fbRemotePinHash = null;  // pinHash currently stored on the board doc (null = not set yet)
let fbPinHashLocal = null;   // this device's cached, verified PIN hash
let fbPulling = false;

function fbSetStatus(s){
  const el = document.getElementById("fbstatus");
  if(!el) return;
  el.className = "fbstatus " + s;
  el.textContent = s==="live" ? "● LIVE" : s==="readonly" ? "● LIVE (read-only — enter station PIN to edit)" : s==="conflict" ? "● updated elsewhere — reloading" : "● LOCAL ONLY";
}
try{
  const raw = localStorage.getItem(FB_PIN_KEY);
  if(raw) fbPinHashLocal = (JSON.parse(raw)||{}).hash || null;
}catch(e){}

async function fbHashPin(pin){
  const enc = new TextEncoder().encode(String(pin==null?"":pin).trim());
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function fbCanWriteNow(){
  if(!FB_REQUIRE_PIN) return true;
  return !!fbPinHashLocal && (fbRemotePinHash==null || fbPinHashLocal===fbRemotePinHash);
}

async function fbInit(){
  fbSetStatus("local");
  if(!location.protocol.startsWith("http")) return; // file:// never touches the network
  const cfg = window.__DUTY_BOARD_FIREBASE_CONFIG__;
  if(!cfg || !cfg.apiKey || !cfg.projectId) return; // not configured — stays local-only
  try{
    const [appMod, fsMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/"+FB_SDK+"/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/"+FB_SDK+"/firebase-firestore.js"),
    ]);
    const app = appMod.initializeApp(cfg);
    fbDb = fsMod.getFirestore(app);
    fbDocRef = fsMod.doc(fbDb, "boards", "perth");
    fbFns = fsMod;
    await fbPull();
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") fbPull(); });
  }catch(e){
    console.warn("Live board unavailable, running local-only.", e);
    fbEnabled = false;
    fbSetStatus("local");
  }
}

async function fbPull(){
  if(!fbDocRef || fbPulling) return;
  fbPulling = true;
  try{
    const snap = await fbFns.getDoc(fbDocRef);
    if(snap.exists()){
      const remote = snap.data();
      fbRemotePinHash = remote.pinHash || null;
      if(typeof remote.rev==="number" && remote.rev > fbRev){
        fbRev = remote.rev;
        if(!rehearsal && remote.state && Array.isArray(remote.state.members)){
          state = remote.state;
          lastCommitted = JSON.stringify(state);
          try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e2){}
          selectedId=null; confirmBox=null;
          render();
        }
      }
    }
    fbEnabled = true;
    fbSetStatus(fbCanWriteNow() ? "live" : "readonly");
  }catch(e){
    console.warn("Live board pull failed, staying on local copy.", e);
    fbSetStatus("local");
  }finally{
    fbPulling = false;
  }
}

function fbUiPrompt(text, placeholder){
  // window.prompt() is unreliable here — some browsers throw, and it commonly no-ops in
  // installed/standalone PWA mode (no browser chrome to anchor it), which is exactly how
  // this app is meant to run on a crew's home screen. Uses the app's own bottom-bar prompt.
  return new Promise(resolve=>{
    openPrompt(text, placeholder, v=>resolve(v && v.trim() ? v.trim() : null), {inputType:"password", submitLabel:"Confirm", onCancel:()=>resolve(null)});
  });
}
async function fbEnsurePin(){
  if(fbCanWriteNow()) return true;
  if(fbRemotePinHash==null){
    const pin = await fbUiPrompt("Set a station PIN for this live board (shared with whoever will make changes):", "e.g. 1234");
    if(!pin) return false;
    fbPinHashLocal = await fbHashPin(pin);
  } else {
    const pin = await fbUiPrompt("Enter the station PIN to edit the live board:", "Cancel keeps this change local-only");
    if(!pin) return false;
    const hash = await fbHashPin(pin);
    if(hash !== fbRemotePinHash){
      say("Incorrect station PIN — change saved on this device only, not sent to the live board.","bad");
      render();
      return false;
    }
    fbPinHashLocal = hash;
  }
  try{ localStorage.setItem(FB_PIN_KEY, JSON.stringify({hash: fbPinHashLocal})); }catch(e){}
  return true;
}

async function fbPush(){
  if(!fbEnabled || rehearsal || !fbDocRef) return;
  try{
    const authorized = await fbEnsurePin();
    if(!authorized){ fbSetStatus("readonly"); return; }
    const expectedRev = fbRev;
    const payload = {
      rev: expectedRev + 1,
      state: JSON.parse(JSON.stringify(state)),
      pinHash: fbRemotePinHash==null ? fbPinHashLocal : fbRemotePinHash,
      updatedAt: Date.now()
    };
    await fbFns.runTransaction(fbDb, async (tx)=>{
      const snap = await tx.get(fbDocRef);
      const curRev = snap.exists() ? (snap.data().rev||0) : 0;
      if(curRev !== expectedRev) throw {__fbConflict:true};
      tx.set(fbDocRef, payload);
    });
    fbRev = payload.rev;
    fbRemotePinHash = payload.pinHash;
    fbSetStatus("live");
  }catch(e){
    if(e && e.__fbConflict){
      say("Board updated by someone else — redo your change.","warn");
      fbSetStatus("conflict");
      fbPull().catch(()=>{});
    } else {
      console.warn("Live board push failed, staying local-only for now.", e);
      fbSetStatus("local");
    }
  }
}

// Wrap the existing local save() so every local write also attempts a live push.
// The original always runs first and unconditionally — a Firebase failure of any
// kind never affects local persistence.
const __localSave = save;
save = function(){
  __localSave();
  try{ fbPush(); }catch(e){ console.warn("Live board sync hook failed", e); }
};

fbInit();
</script>
