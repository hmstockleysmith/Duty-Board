// Inline manifest via blob URL — keeps the app single-file. Icon is an inline SVG data URI.
(function(){
  const iconSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%2312161b'/><rect x='64' y='110' width='384' height='44' rx='10' fill='%23e8b73a'/><rect x='64' y='186' width='384' height='44' rx='10' fill='%23c74436'/><rect x='64' y='262' width='260' height='44' rx='10' fill='%234a8f5c'/><text x='256' y='420' font-family='monospace' font-size='80' font-weight='bold' fill='%23e6e2d8' text-anchor='middle'>DUTY</text></svg>";
  const manifest = {
    name: "Perth Duty Board",
    short_name: "Duty Board",
    description: "Perth Fire Station electronic duty board — concept demonstrator",
    start_url: ".",
    scope: ".",
    display: "standalone",
    background_color: "#12161b",
    theme_color: "#12161b",
    icons: [
      { src: "data:image/svg+xml," + iconSvg, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
  // Service worker for offline capability. Only registers when served over http(s) —
  // silently skipped on file:// so the plain downloaded file behaves exactly as before.
  // Registered from a real sw.js (relative path) rather than a blob URL: some browsers
  // (notably iOS Safari) refuse to register a worker whose script is a blob: URL.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).catch(()=>{
      // sw.js missing/blocked on this host — app still runs, just without offline caching.
    });
  }
})();

<style>

<script>
"use strict";
/* ============================================================
   Perth Station E-Duty Board — standalone, offline, no backend.
   Saves to this device's browser storage only.
   Concept demonstrator, not an operational system.
   ============================================================ */
const STORE_KEY = "perth-eduty-v9";
const REQ_SO = 2; // "SNAPs" = the Station Officers on shift
const SHIFTS = ["A","B","C","D"];
// ---- Shift rotation (8-day cycle). Anchored to 12 Jul 2026 = cycle day 0. ----
// Day shift 08:00-18:00, night shift 18:00-08:00. Verified against the known roster.
const DAY_CREW   = ["A","A","D","D","C","C","B","B"];
const NIGHT_CREW = ["B","B","A","A","D","D","C","C"];
function cyclePos(d){
  const ref=new Date(2026,6,12);
  const day0=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((day0-ref)/86400000);
  return ((diff%8)+8)%8;
}
// Rehearsal virtual clock (declared early so currentDuty/nowDate can use it).
let rehearsal = null; // set fully in enterRehearsal(); { snap, snapUndo, virtualMs, offsetMs }
const nowMs = () => Date.now() + (rehearsal ? rehearsal.offsetMs : 0);
const nowDate = () => new Date(nowMs());
function currentDuty(now){
  now = now || nowDate();
  const h = now.getHours() + now.getMinutes()/60;
  // Show the shift that is on now, OR the shift that starts within the next two hours
  // (06:00–08:00 opens the incoming day crew; 16:00–18:00 opens the incoming night crew).
  // People come in early to relieve and settle before shift, so the board follows them.
  if(h>=6 && h<8){
    // between 06:00 and 08:00, day crew of TODAY is incoming
    return { shift:DAY_CREW[cyclePos(now)], phase:"Day (incoming)", ref:now };
  }
  if(h>=8 && h<16){
    return { shift:DAY_CREW[cyclePos(now)],   phase:"Day",   ref:now };
  }
  if(h>=16 && h<18){
    return { shift:NIGHT_CREW[cyclePos(now)], phase:"Night (incoming)", ref:now };
  }
  if(h>=18){
    return { shift:NIGHT_CREW[cyclePos(now)], phase:"Night", ref:now };
  }
  // before 06:00 — still last night's crew on
  const y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  return { shift:NIGHT_CREW[cyclePos(y)], phase:"Night", ref:y };
}
// The shift that just came OFF duty (whose stragglers on the board are holdbacks).
function prevDuty(now){
  now = now || nowDate();
  const h = now.getHours() + now.getMinutes()/60;
  // Before the incoming crew has officially taken over (h<8 during day lead-in, or 16..18
  // during night lead-in), "prev" = the crew still on the board handing over.
  if(h>=6 && h<8){ const y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1); return NIGHT_CREW[cyclePos(y)]; }
  if(h>=8 && h<16){ const y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1); return NIGHT_CREW[cyclePos(y)]; }
  if(h>=16 && h<18) return DAY_CREW[cyclePos(now)];
  if(h>=18) return DAY_CREW[cyclePos(now)];
  const y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  return DAY_CREW[cyclePos(y)];
}

const NOTE_TTL_MS = 60000;
function pushRelease(title, body, skipNotes){
  releaseNotes.push({ id: Date.now()+Math.floor(Math.random()*1000), title, body, skipNotes: skipNotes||[], ts: nowMs() });

  releaseNotes = releaseNotes.filter(n=>n.id!==id);

function pruneReleases(){
  const cutoff = nowMs() - NOTE_TTL_MS;
  const before = releaseNotes.length;
  releaseNotes = releaseNotes.filter(n=>n.ts >= cutoff);
  return releaseNotes.length !== before;
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return { members: SEED.map(m=>({...m})), relieverReqs: [], shift:"B", reqVR:6, templates:{}, setArrangement:{}, standbys:[], offline:{} };
    const saved = JSON.parse(raw);
    const byId = Object.fromEntries((saved.members||[]).map(m=>[m.id,m]));
    const members = SEED.map(seed => byId[seed.id] ? {...seed, ...byId[seed.id]} : {...seed})
      .concat((saved.members||[]).filter(m=>m.ext)); // external relievers aren't in SEED — keep them
    return { members, relieverReqs: saved.relieverReqs||[], shift: saved.shift||"B", reqVR: saved.reqVR!=null?saved.reqVR:6, templates: saved.templates||{}, setArrangement: saved.setArrangement||{}, standbys: saved.standbys||[], offline: saved.offline||{} };
  }catch(e){
    return { members: SEED.map(m=>({...m})), relieverReqs: [], shift:"B", reqVR:6, templates:{}, setArrangement:{}, standbys:[], offline:{} };
  }
}
function save(){
  if(rehearsal) return; // rehearsal changes never touch localStorage
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ say("Could not save to this device's browser storage.", "bad"); }
}
function enterRehearsal(targetMs){
  if(rehearsal) return;
  // Aim rehearsal at the incoming window that makes sense now: 06:00 (2h before day) or
  // 16:00 (2h before night). If already past 16:00, aim at 06:00 tomorrow. Caller can
  // override with an explicit ms.
  if(targetMs==null){
    const now = new Date();
    const h = now.getHours();
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    if(h < 6)          t.setHours(6);  // aim at 06:00 today (day crew coming in)
    else if(h < 16)    t.setHours(16); // aim at 16:00 today (night crew coming in)
    else             { t.setDate(t.getDate()+1); t.setHours(6); } // aim at 06:00 tomorrow
    targetMs = t.getTime();
  }
  rehearsal = {
    snap: JSON.stringify(state),
    snapUndo: undoSnap,
    virtualMs: targetMs,
    offsetMs: targetMs - Date.now()
  };
  state.shift = currentDuty().shift; // follow the incoming/on-duty shift for the virtual time
  const label = new Date(targetMs).toLocaleString([], {weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});
  selectedId=null; confirmBox=null;
  say("Rehearsal ON \u2014 clock set to "+label+". Play through the changeover; nothing saves.","warn");
  render();
}
function setRehearsalTime(hhmm){
  if(!rehearsal) return;
  const parts=(hhmm||"").split(":"); const h=parseInt(parts[0],10), mi=parseInt(parts[1],10);
  if(isNaN(h)||isNaN(mi)) return;
  const base=new Date(rehearsal.virtualMs);
  base.setHours(h,mi,0,0);
  rehearsal.virtualMs = base.getTime();
  rehearsal.offsetMs = base.getTime() - Date.now();
  state.shift = currentDuty().shift;
  say("Rehearsal clock set to "+fmt(base.getTime())+".","info");
  render();
}
function exitRehearsal(){
  if(!rehearsal) return;
  state = JSON.parse(rehearsal.snap);
  undoSnap = rehearsal.snapUndo;
  lastCommitted = JSON.stringify(state);
  rehearsal = null;
  selectedId=null; confirmBox=null;
  say("Rehearsal ended. Real board restored.","info");
  save(); render();
}

// ---- Rule engine ----
// Quals that don't affect Perth crewing (3.4/2.4 variants, SET, ICV, POD, USAR — USAR turns
// out as a specialist crew and is a leave reason, not a station crewing qual). Hidden from
// the roster line to cut clutter; toggle-governed quals (CLP/CSR/RRS/VR) show as toggles.
const IRRELEVANT_QUALS = ["2.4","3.4","SET","ICV","POD","USAR"];
const TOGGLE_QUALS = ["CLP","CSR","RRS","VR"];
const displayQuals = m => (m.quals||[]).filter(q =>
  !IRRELEVANT_QUALS.some(p=>q.startsWith(p)) && !TOGGLE_QUALS.includes(q));
const isJunior = m => m.rank==="FF" && !m.stripe;
const seniorOrStripe = m => m.rank==="SFF" || m.stripe;
const countsVR = m => m.vr;
const isOfficer = m => m.rank==="SO" || m.rank==="DO";

function seatEligibility(seat, m){
  switch(seat.role){
    case "SO":  return m.rank==="SO" ? {ok:true} : {ok:false, reason:"Requires Station Officer rank"};
    case "DRV": return isOfficer(m) ? {ok:false, reason:"Officers do not crew firefighter seats"} : (m.topo ? {ok:true} : {ok:false, reason:"Requires topo (Perth topography driver)"});
    case "CLP": return (m.rank==="SFF" && m.clp) ? {ok:true} : {ok:false, reason:"Requires Senior Firefighter with CLP"};
    case "FF1": case "FF2":
      return isOfficer(m) ? {ok:false, reason:"Officers do not crew firefighter seats"} : {ok:true};
    default: return {ok:true};
  }
}
function occupancy(members){
  const o={}; members.forEach(m=>{ if(m.status==="on"&&m.seatId) o[m.seatId]=m; }); return o;
}
const truckOffline = tid => !!(state.offline && state.offline[tid]);
const activeSeats = () => ALL_SEATS.filter(s=>!truckOffline(s.truckId));
function pairIssue(truckId, occ){
  if(truckOffline(truckId)) return null;
  const ff1=occ[truckId+"-ff1"], ff2=occ[truckId+"-ff2"];
  if(ff2 && isJunior(ff2) && ff1 && !seniorOrStripe(ff1))
    return "FF1 must be a One-Striper or Senior when FF2 is a Junior";
  // Minimum one Senior Firefighter (rank SFF) per pump, in any firefighter seat — driving
  // counts, a stripe does not, the SO does not. ASSUMPTION pending clarification: seat
  // position doesn't matter (senior may drive with a one-striper in FF1). If the rule
  // firms up to "senior must be FF1", tighten here.
  const drv=occ[truckId+"-drv"];
  const ffSeats=[drv,ff1,ff2].filter(Boolean);
  if(ffSeats.length===3 && !ffSeats.some(m=>m.rank==="SFF"))
    return "Pump needs at least one Senior Firefighter aboard (any FF seat)";
  return null;
}
const hasCsrRrs = m => m.csr || m.rrs;
// VR minimum turnout (updated rule): 1 Station Officer holding VR, plus at least 3
// firefighters holding VR, plus a 4th firefighter slot filled by either another VR holder
// or ONE CSR cat-2 / RRS holder (the substitute path). Never fewer than 3 actual VR
// firefighters regardless of substitutes. Total minimum: 5 people.
// A VR-qualified member seated on the CLP does NOT count toward VR — they'll rotate back
// onto a pump later, but for the shift's VR turnout they're on the aerial appliance.
const isOnCLP = m => m.seatId==="clp-1" || m.seatId==="clp-2";
const VR_FF_MIN = 3;      // hard floor of actual VR firefighters
const VR_FF_SLOTS = 4;    // firefighter slots to fill (4th may be the CSR/RRS sub)
const VR_TOTAL = 5;       // display denominator: 4 FF slots + 1 SO with VR
function vrBreakdown(list){
  const vrFF   = list.filter(m=>!isOfficer(m) && m.vr && !isOnCLP(m)).length;
  const soVR   = list.some(m=>m.rank==="SO" && m.vr && !isOnCLP(m));
  const subs   = list.filter(m=>!isOfficer(m) && !m.vr && hasCsrRrs(m) && !isOnCLP(m)).length;
  const subUsed = vrFF < VR_FF_SLOTS && subs > 0;
  const ffEffective = Math.min(VR_FF_SLOTS, vrFF + (subUsed ? 1 : 0));
  const met = soVR && vrFF >= VR_FF_MIN && ffEffective >= VR_FF_SLOTS;
  // `effective` counts the crew toward the 5-person minimum for display: FF side + the SO.
  const effective = ffEffective + (soVR ? 1 : 0);
  return { vrFF, soVR, subs, subUsed, ffEffective, effective, met };
}
function vrStatus(members){
  const seated = members.filter(m=>m.status==="on"&&m.seatId);
  const b = vrBreakdown(seated);
  return { count:b.vrFF, effective:b.effective, soVR:b.soVR, subUsed:b.subUsed, met:b.met, vrFF:b.vrFF };
}
function crewVROk(crew){
  return vrBreakdown(crew).met;
}
function shiftCounts(members){
  const seated=members.filter(m=>m.status==="on"&&m.seatId);
  return { vr:seated.filter(countsVR).length, so:seated.filter(m=>m.rank==="SO").length };
}
function boardIssues(members){
  const occ=occupancy(members), out=[];
  activeSeats().forEach(seat=>{
    const m=occ[seat.id];
    if(!m) out.push({type:"seat", text:seat.truckName+": "+seat.label+" unfilled", need:seat.role});
    else{
      const el=seatEligibility(seat,m);
      if(!el.ok) out.push({type:"seat", text:seat.truckName+": "+m.name+" in "+seat.label+" ("+el.reason.toLowerCase()+")", need:seat.role});
    }
  });
  ["p1","p2"].forEach(tid=>{
    const p=pairIssue(tid,occ);
    if(p) out.push({type:"pair", text:(tid==="p1"?"PERTH 1ST: ":"PERTH 2ND: ")+p, need:"FF1"});
  });
  const vs=vrStatus(members);
  if(!vs.met && (vs.vrFF < VR_FF_MIN || vs.effective < VR_TOTAL - (vs.soVR?0:1))) out.push({type:"count", text:"VR: "+vs.effective+" of "+VR_TOTAL+(vs.subUsed?" (incl. 1 CSR/RRS)":"")+(vs.vrFF<VR_FF_MIN?" — needs \u2265"+VR_FF_MIN+" VR firefighters":""), need:"VR"});
  if(!vs.soVR && vs.vrFF>=VR_FF_MIN) out.push({type:"count", text:"VR crew needs a Station Officer holding VR", need:"VR_SO"});

// Compute the ms timestamp when a member's next rostered shift begins, from a given moment.
// Uses the DAY_CREW/NIGHT_CREW cycle. Returns null if we can't find one within nine days.
function nextRosteredStart(member, fromMs){
  fromMs = fromMs || nowMs();
  const from = new Date(fromMs);
  for(let dayOffset=0; dayOffset<9; dayOffset++){
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate()+dayOffset);
    const pos = cyclePos(d);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0, 0, 0).getTime();
    const nightStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 18, 0, 0, 0).getTime();
    if(DAY_CREW[pos]===member.shift && dayStart>fromMs) return dayStart;
    if(NIGHT_CREW[pos]===member.shift && nightStart>fromMs) return nightStart;
  }
  return null;
}
// "Can this outgoing-shift member hold back into the incoming shift without running into
// their own next rostered shift?" Exactly back-to-back is fine. If holding back overruns
// the next rostered start, they can't be held; a callback is required instead.
function canHoldBack(m, projectedEndMs){
  const next = nextRosteredStart(m);
  if(next==null) return { ok:true, until:null };
  return { ok: projectedEndMs <= next, until: next };
}
// Release key for the shift a member would otherwise work next: "YYYY-MM-DD:Day|Night".
function nextRosteredKey(member, fromMs){
  fromMs = fromMs || nowMs();
  const from = new Date(fromMs);
  for(let dayOffset=0; dayOffset<9; dayOffset++){
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate()+dayOffset);
    const pos = cyclePos(d);
    const iso = d.toISOString().slice(0,10);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0, 0, 0).getTime();
    const nightStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 18, 0, 0, 0).getTime();
    if(DAY_CREW[pos]===member.shift && dayStart>fromMs) return iso+":Day";
    if(NIGHT_CREW[pos]===member.shift && nightStart>fromMs) return iso+":Night";
  }
  return null;
}
// Is this member released from the shift currently being viewed on the board?
function releasedFromActive(m){
  if(!m.superHBReleased || !m.superHBReleased.length) return false;
  const now = nowDate();
  const iso = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString().slice(0,10);
  const todayIso = iso(now);
  const yestIso = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()-1));
  const tomIso  = iso(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1));
  return m.superHBReleased.some(k=>{
    const parts = k.split(":");
    const dISO = parts[0], phase = parts[1];
    if(dISO!==todayIso && dISO!==yestIso && dISO!==tomIso) return false;
    const dd = new Date(dISO+"T00:00:00");
    const pos = cyclePos(dd);
    const letter = phase==="Day" ? DAY_CREW[pos] : NIGHT_CREW[pos];
    return letter === state.shift && letter === m.shift;
  });
}
// Fairness tally: every OT stamp bumps to now; unflag restores the previous stamp.
function stampOT(m){ m.lastOTPrev = m.lastOT || null; m.lastOT = nowMs(); }
function unstampOT(m){ m.lastOT = m.lastOTPrev || null; m.lastOTPrev = null; }

// Platoon (Staff Shortage) Matrix — per OPS Circular 47/2016. Given which platoon is on
// duty and which shift-of-set it is (1st day, 2nd day, 1st night, 2nd night), returns
// [ {platoon, action}, ... ] in priority order. "ASPSA" means: exhausted the matrix; the
// SO calls a super holdback or takes the truck offline depending on the situation.
const SHORTAGE_MATRIX = {
  A: {
    "1st day":   [{platoon:"C",action:"Hold Back"}, {platoon:"D",action:"Call Back"}, {platoon:"B",action:"Call Back"}],
    "2nd day":   [{platoon:"D",action:"Call Back"}, {platoon:"C",action:"Call Back"}, {platoon:"ASPSA"}],
    "1st night": [{platoon:"C",action:"Call Back"}, {platoon:"B",action:"Call Back"}, {platoon:"ASPSA"}],
    "2nd night": [{platoon:"D",action:"Hold Back"}, {platoon:"B",action:"Call Back"}, {platoon:"C",action:"Call Back"}]
  },
  B: {
    "1st day":   [{platoon:"D",action:"Hold Back"}, {platoon:"A",action:"Call Back"}, {platoon:"C",action:"Call Back"}],
    "2nd day":   [{platoon:"A",action:"Call Back"}, {platoon:"D",action:"Call Back"}, {platoon:"ASPSA"}],
    "1st night": [{platoon:"D",action:"Call Back"}, {platoon:"C",action:"Call Back"}, {platoon:"ASPSA"}],
    "2nd night": [{platoon:"A",action:"Hold Back"}, {platoon:"C",action:"Call Back"}, {platoon:"D",action:"Call Back"}]
  },
  C: {
    "1st day":   [{platoon:"A",action:"Hold Back"}, {platoon:"B",action:"Call Back"}, {platoon:"D",action:"Call Back"}],
    "2nd day":   [{platoon:"B",action:"Call Back"}, {platoon:"A",action:"Call Back"}, {platoon:"ASPSA"}],
    "1st night": [{platoon:"A",action:"Call Back"}, {platoon:"D",action:"Call Back"}, {platoon:"ASPSA"}],
    "2nd night": [{platoon:"B",action:"Hold Back"}, {platoon:"D",action:"Call Back"}, {platoon:"A",action:"Call Back"}]
  },
  D: {
    "1st day":   [{platoon:"B",action:"Hold Back"}, {platoon:"C",action:"Call Back"}, {platoon:"A",action:"Call Back"}],
    "2nd day":   [{platoon:"C",action:"Call Back"}, {platoon:"B",action:"Call Back"}, {platoon:"ASPSA"}],
    "1st night": [{platoon:"B",action:"Call Back"}, {platoon:"A",action:"Call Back"}, {platoon:"ASPSA"}],
    "2nd night": [{platoon:"C",action:"Hold Back"}, {platoon:"A",action:"Call Back"}, {platoon:"B",action:"Call Back"}]
  }
};
// Which shift-of-set is a given platoon working, at a given moment?
// Each platoon has 4 consecutive cycle positions. Return "1st day" / "2nd day" /
// "1st night" / "2nd night", or null if the platoon isn't on duty at that time.
function shiftOfSet(platoon, now){
  now = now || nowDate();
  const h = now.getHours() + now.getMinutes()/60;
  const pos = cyclePos(now);
  // The platoon's cycle position table, ordered by set-position:
  //   A: [(0,day),(1,day),(2,night),(3,night)]
  //   B: [(6,day),(7,day),(0,night),(1,night)]  -- day comes before night in a set
  //   C: [(4,day),(5,day),(6,night),(7,night)]
  //   D: [(2,day),(3,day),(4,night),(5,night)]
  // NOTE: for B, when we're on cycle position 0 or 1 (which is a B NIGHT), the "1st day"
  // and "2nd day" of that set were the two previous days on positions 6 and 7 (the tail of
  // the previous 8-day rotation). For matrix lookup we care about the current shift, so:
  const SET = {
    A: {0:{shift:"1st day",phase:"day"}, 1:{shift:"2nd day",phase:"day"}, 2:{shift:"1st night",phase:"night"}, 3:{shift:"2nd night",phase:"night"}},
    B: {6:{shift:"1st day",phase:"day"}, 7:{shift:"2nd day",phase:"day"}, 0:{shift:"1st night",phase:"night"}, 1:{shift:"2nd night",phase:"night"}},
    C: {4:{shift:"1st day",phase:"day"}, 5:{shift:"2nd day",phase:"day"}, 6:{shift:"1st night",phase:"night"}, 7:{shift:"2nd night",phase:"night"}},
    D: {2:{shift:"1st day",phase:"day"}, 3:{shift:"2nd day",phase:"day"}, 4:{shift:"1st night",phase:"night"}, 5:{shift:"2nd night",phase:"night"}}
  }[platoon];
  const slot = SET[pos];
  if(!slot) return null;
  // Confirm the phase (day 08-18, night 18-08) matches the calendar hour, otherwise the
  // platoon isn't currently on. Note the "incoming" windows (06-08, 16-18) are treated as
  // if the incoming shift is on.
  const isDayHour = h>=6 && h<16;
  const isNightHour = h>=16 || h<6;
  if(slot.phase==="day"   && !isDayHour) return null;
  if(slot.phase==="night" && !isNightHour) return null;
  return slot.shift;
}
// Returns the current SOP order for the ACTIVE shift viewed on the board.
function currentShortageOrder(){
  const on = state.shift;
  const sos = shiftOfSet(on);
  if(!sos) return null;
  return { platoon:on, shiftOfSet:sos, order: SHORTAGE_MATRIX[on][sos] };
}
// Forecast: the ms at the start of a given ISO date + phase (Day/Night).
function forecastShiftStartMs(iso, phase){
  const d = new Date(iso+"T00:00:00");
  d.setHours(phase==="Day" ? 8 : 18, 0, 0, 0);
  return d.getTime();
}
// Which platoon works a given ISO+phase, from the 8-day cycle.
function forecastPlatoon(iso, phase){
  const d = new Date(iso+"T00:00:00");
  const pos = cyclePos(d);
  return phase==="Day" ? DAY_CREW[pos] : NIGHT_CREW[pos];
}
// Shift-of-set label for a forecast target.
function forecastShiftOfSet(iso, phase){
  const d = new Date(iso+"T00:00:00");
  d.setHours(phase==="Day" ? 10 : 20, 0, 0, 0);
  return shiftOfSet(forecastPlatoon(iso, phase), d);
}
// SOP order for a forecast target.
function forecastShortageOrder(iso, phase){
  const platoon = forecastPlatoon(iso, phase);
  const sos = forecastShiftOfSet(iso, phase);
  if(!sos) return null;
  return { platoon, shiftOfSet:sos, order: SHORTAGE_MATRIX[platoon][sos] };
}
// The default forecast target: the next changeover after now.
function defaultForecastTarget(){
  const now = nowDate();
  const h = now.getHours();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // If we're before 08:00, next changeover is today's 08:00 (day).
  // 08:00–18:00, next is 18:00 (night). After 18:00, next is tomorrow 08:00 (day).
  if(h < 8)  return { iso: d.toISOString().slice(0,10), phase: "Day" };
  if(h < 18) return { iso: d.toISOString().slice(0,10), phase: "Night" };
  d.setDate(d.getDate()+1);
  return { iso: d.toISOString().slice(0,10), phase: "Day" };
}
// Is this member expected to be off (leave / relief block) at the given forecast time?
// Returns a status string ("Annual leave", "Relieving out until 20 Jul", etc) or null.
function forecastUnavailableReason(m, targetMs){
  if(m.expectedOff){
    return "Expected off · "+m.expectedOff;
  }
  if(m.avail && m.avail!=="Available" && m.avail!=="Relieving out"){
    // Static leave status — assume it applies unless the member has clearer end info.
    return m.avail;
  }
  if(m.avail==="Relieving out"){
    if(!m.relievingOutUntil) return "Relieving out (indefinite)";
    if(targetMs < m.relievingOutUntil) return "Relieving out until "+new Date(m.relievingOutUntil).toLocaleDateString([], {day:"2-digit",month:"short"});
    return null; // back by then
  }
  // Super holdback release
  if(m.superHBReleased && m.superHBReleased.length){
    const targetD = new Date(targetMs);
    const iso = new Date(targetD.getFullYear(), targetD.getMonth(), targetD.getDate()).toISOString().slice(0,10);
    const phase = targetD.getHours() < 12 ? "Day" : "Night";
    const key = iso+":"+phase;
    if(m.superHBReleased.includes(key)) return "Released — super holdback";
  }
  return null;
}
// The forecast holdback note (short free text). Keyed per member, one at a time — a member
// can only be "forecast to hold back" for one upcoming shift at a time. Cleared when the
// board is cleared or when the note is manually removed.
function setForecastHoldback(id, note){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  if(!note) delete m.forecastHoldback;
  else m.forecastHoldback = note;
  commit();
}
// Mark a member as "expected off" for the upcoming shift — e.g. a sick call taken during
// the current shift, or advance notice that they won't be in. Doesn't touch their real
// roster availability. Used only by the forecast projection. Cleared explicitly or by
// the "clear all" action when the next shift starts.
function toggleExpectedOff(id, reason){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  if(m.expectedOff){
    delete m.expectedOff;
    say(m.name+" no longer expected off for the forecast shift.","info");
  } else {
    m.expectedOff = reason || "Expected off";
    say(m.name+" marked expected off for the forecast shift ("+m.expectedOff+"). Roster availability unchanged.","info");
  }

}
function promptBookedOff(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  openPrompt("Reason "+m.name+" is booked off for the forecast shift?", "PSL, carer's, late etc — optional", (v)=>{

function clearAllExpectedOff(){
  let n=0;
  state.members.forEach(m=>{ if(m.expectedOff){ delete m.expectedOff; n++; } });

  else render();

// Compute projected coverage for a specific forecast target. Returns rows suitable for
// display and a boolean "shortfall" flag. Uses `expectedOff` on top of real availability.
function forecastCoverage(iso, phase){
  const platoon = forecastPlatoon(iso, phase);
  const startMs = forecastShiftStartMs(iso, phase);
  const rostered = state.members.filter(m => m.shift===platoon);
  const available = rostered.filter(m => !forecastUnavailableReason(m, startMs));
  const need = k => available.filter(m => coversNeed(m, k)).length;
  // Qual-aware requirement rows. Everyone assumed present unless a leave status or an
  // expected-off (PSL call etc) flag says otherwise. TOPO drivers and the composed VR
  // minimum are checked, not just headcounts.
  // NOTE on CLP vs VR interaction: 2 of the available must sit on the CLP, and CLP-seated
  // members don't count toward VR. The rough check below flags it; the feasibility solve
  // in forecastFeasibility() is the authoritative answer.
  const vrB = vrBreakdown(available); // upper bound: assumes nobody is on CLP yet
  const rows = [
    { label:"Station Officers",     req:2,  have:available.filter(m => m.rank==="SO").length, key:"SO",   qual:"Station Officer" },
    { label:"TOPO drivers",         req:2,  have:need("DRV"),                                  key:"DRV",  qual:"TOPO driver (firefighter)" },
    { label:"CLP operators",        req:2,  have:need("CLP"),                                  key:"CLP",  qual:"Senior Firefighter with CLP" },
    { label:"VR (composed min)",    req:VR_TOTAL, have:vrB.effective,                          key:"VR",   qual:(vrB.vrFF<VR_FF_MIN?"VR firefighter":(!vrB.soVR?"Station Officer with VR":"VR firefighter or CSR cat-2/RRS")) },
    { label:"Total available",      req:10, have:available.length,                             key:"TOTAL", qual:"any member" }
  ];
  const short = rows.filter(r => r.key==="VR" ? !vrB.met : r.have < r.req);
  return { platoon, available, rows, short, hasShortfall: short.length>0, vrB };
}
// Authoritative feasibility check: can a fully legal board actually be built from the
// projected-available list? Tries the real crew solver over candidate subsets. Returns
// { ok } or { ok:false, missing:[...qual strings...] } naming what a holdback/callback
// would need to bring. This catches interactions the headcounts miss — e.g. enough CLP
// holders on paper, but seating them on CLP drops VR below minimum.
function forecastFeasibility(iso, phase){
  const cov = forecastCoverage(iso, phase);
  const avail = cov.available;
  const seats = activeSeats();
  if(avail.length >= seats.length){
    // Try subsets: prefer keeping every qual-rich member in. Greedy: sort by "qual weight"
    // (more quals = keep) and try the top N, then a few rotations of the tail.
    const weight = m => (m.rank==="SO"?8:0)+(m.vr?4:0)+(m.clp?3:0)+(m.topo?2:0)+(hasCsrRrs(m)?1:0);
    const sorted = [...avail].sort((a,b)=>weight(b)-weight(a));
    const tries = Math.min(6, avail.length - seats.length + 1);
    for(let k=0; k<Math.max(1,tries); k++){
      const subset = sorted.slice(0, seats.length - 0).concat().slice(0, seats.length);
      // rotate one tail member in per try
      if(k>0){
        const idx = seats.length - k;
        if(idx>=0 && sorted[seats.length+k-1]) subset[idx] = sorted[seats.length+k-1];
      }
      if(subset.length===seats.length && solveCrew(subset.map(m=>({...m})))) return { ok:true, cov };
    }
  }
  // Couldn't build a board — name what's missing, most specific first.
  const missing = [];
  cov.short.forEach(r => {
    if(r.key==="TOTAL"){ missing.push((r.req-r.have)+" more member"+((r.req-r.have)===1?"":"s")+" (any)"); }
    else if(r.key==="VR"){ missing.push(r.qual); }
    else { missing.push((r.req-r.have)+" \u00d7 "+r.qual); }
  });
  // Interaction case: headcounts pass but the solve failed (e.g. CLP seating starves VR)
  if(!missing.length) missing.push("a qualification mix that lets CLP be crewed without dropping VR below minimum \u2014 likely 1 more VR firefighter or CLP holder");
  return { ok:false, cov, missing };
}

function coversNeed(m, need){
  if(need==="VR") return m.vr || (!isOfficer(m) && hasCsrRrs(m));
  if(need==="VR_SO") return m.rank==="SO" && m.vr;
  if(need==="SO") return m.rank==="SO";
  if(need==="DRV") return m.topo && !isOfficer(m);
  if(need==="CLP") return m.rank==="SFF"&&m.clp;
  if(need==="FF1") return seniorOrStripe(m)&&!isOfficer(m);
  return true;
}
function swapKeepsCounts(members, leaver, incomer){
  const before=vrStatus(members);
  const sim=members.map(m=>{
    if(m.id===leaver.id) return {...m, status:"out", seatId:null};
    if(incomer && m.id===incomer.id) return {...m, status:"on", seatId:leaver.seatId};
    return m;
  });
  const after=vrStatus(sim);
  const notWorse = after.effective>=before.effective && (after.soVR || !before.soVR);
  const ok = after.met || notWorse;
  const which = !ok ? (after.effective<before.effective ? "VR minimum broken (needs SO-VR + \u2265"+VR_FF_MIN+" VR FFs + 4th slot)" : "no Station Officer with VR in the crew") : null;
  return { ok, which };
}
const fmt = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false}) : "--:--";
// "Standby" in m.ot means a shift-for-shift swap presence — NOT overtime.
const otLabel = m => m.ot ? (m.ot==="Standby" ? " (Standby swap)" : " ("+m.ot+" OT)") : "";
const swapHint = m => (!m.ext && m.shift!==state.shift && m.ot) ? (m.ot==="Standby" ? " Pick who they're covering in the OT panel to log the debt." : " Auto-flagged — select them to change Holdback / Standby / Callback if wrong.") : "";

// Try to seat an exact crew into ALL seats validly (bijection). Returns {seatId:memberId} or null.
// Prefers keeping people in their current seat to minimise disruption.
function solveCrew(crew){
  const seats = activeSeats();
  if(crew.length !== seats.length) return null;
  // VR is invariant once everyone is seated (same people fill all seats), so pre-check it
  if(!crewVROk(crew)) return null;
  const order = [...seats].sort((a,b)=>SEAT_PRIORITY[a.role]-SEAT_PRIORITY[b.role]);
  const assign = {}; const used = new Set();
  const bt = (i) => {
    if(i===order.length){
      for(const tid of ["p1","p2"]){ if(pairIssue(tid, assign)) return false; }
      return true;
    }
    const seat = order[i];
    let cands = crew.filter(m=>!used.has(m.id) && seatEligibility(seat,m).ok);
    // prefer whoever is already in this seat (fewest moves), then juniors for FF2 / seniors for FF1
    cands.sort((a,b)=>{
      const stay = (m)=> (m.seatId===seat.id?0:1);
      if(stay(a)!==stay(b)) return stay(a)-stay(b);
      if(seat.role==="FF1") return (seniorOrStripe(b)?1:0)-(seniorOrStripe(a)?1:0);
      if(seat.role==="FF2") return (isJunior(b)?1:0)-(isJunior(a)?1:0);
      return 0;
    });
    for(const m of cands){
      assign[seat.id]=m; used.add(m.id);
      if(bt(i+1)) return true;
      used.delete(m.id); delete assign[seat.id];
    }
    return false;
  };
  return bt(0) ? {...assign} : null;
}

// Auto-classify a non-rostered arrival (default only — flip it in the action bar if wrong).
// Arrival TIME is deliberately not used: a callback can be phoned at 08:10 and in by 08:40,
// so the board's state at sign-on is the signal instead:
//   Holdback — from the shift that just came off duty, still on the board
//   Callback — came in because the shift couldn't crew itself: they fill an empty seat,
//              or a holdback of their rank class is waiting to be released
//   Standby  — relieves someone on an otherwise-covered board: a pre-arranged
//              shift-for-shift swap (not OT)
//   External relievers get no flag: they're relieving in, not on Perth OT.
function classifyArrival(m, callbackSignal){
  if(m.ot || m.ext || m.shift===state.shift) return;
  if(m.shift===prevDuty()){ m.ot="Holdback"; stampOT(m); return; }
  const holdbackOn = state.members.some(x=>x.status==="on" && x.ot==="Holdback" && isOfficer(x)===isOfficer(m));
  m.ot = (holdbackOn || callbackSignal) ? "Callback" : "Standby";
  if(m.ot==="Callback") stampOT(m);
}

// FIFO relief with rearrangement, shared by signOn and Relieve-next-out.
// Officers relieve officers, firefighters relieve firefighters — an incoming FF can never
// free an SO (and vice versa), so the other class is skipped outright instead of cluttering
// the ticker with impossible candidates.
// Holdbacks are released first (a callback exists to let the holdback go home), then
// earliest-signed-on first. Anyone on duty under 2 hours isn't a relief candidate —
// a fresh arrival is never "first on", so incoming crew can't accidentally boot each other.
// For each candidate leaver, see if the rest of the crew plus the incomer can validly
// fill every seat (jigging people around as needed). Returns true if a relief was applied.
function attemptRelief(m, ts){
  // Anyone who signed on BEFORE the incomer is a valid relief candidate. This lets a
  // shift-change SO who arrived 20 minutes ago relieve one who arrived 40 minutes ago
  // (FIFO order still applies), while stopping the incomer from booting anyone who
  // signed on after them.
  const seated = state.members.filter(x=>x.status==="on"&&x.seatId);
  const queue = seated.filter(x=>isOfficer(x)===isOfficer(m) && (x.signOn||0) < ts)
    .sort((a,b)=> ((b.ot==="Holdback")-(a.ot==="Holdback")) || a.signOn-b.signOn);
  const skips=[];
  for(const target of queue){
    const crew = seated.filter(x=>x.id!==target.id).concat([m]);
    const sol = solveCrew(crew);
    if(!sol){
      const crewVR = crew.filter(c=>c.vr).length;
      if(crewVR < VR_TOTAL) skips.push(target.name+" (would drop VR below minimum)");
      else skips.push(target.name+" (no valid crew arrangement lets them leave)");
      continue;
    }
    const before = {}; seated.forEach(x=>{ before[x.id]=x.seatId; });
    target.status="out"; target.seatId=null;
    Object.entries(sol).forEach(([seatId, mem])=>{
      const mm=state.members.find(x=>x.id===mem.id);
      mm.status="on"; mm.seatId=seatId; mm.forced=false; if(!mm.signOn) mm.signOn=nowMs();
    });
    m.signOn = ts; classifyArrival(m, target.ot==="Holdback"); // releasing a holdback = classic callback
    const moved = Object.keys(sol).map(sid=>sol[sid]).filter(mem=>mem.id!==m.id && before[mem.id] && before[mem.id]!==mem.seatId);
    const seatOfIncomer = seatById(m.seatId);
    let note = skips.length ? "First in couldn't be freed: "+skips.join(", ")+". " : "";
    let jig = moved.length ? " Crew jigged: "+moved.map(x=>x.name+"→"+seatById(x.seatId).label).join(", ")+"." : "";
    // Full-width release card. Include *why* the FIFO queue skipped earlier candidates so
    // the crew see the seat/qual issue, not just the outcome.
    const targetSeat = before[target.id] ? seatById(before[target.id]) : null;
    const targetSeatLabel = targetSeat ? targetSeat.truckName+" "+targetSeat.label : "seat";
    pushRelease(
      target.name+" released off duty",
      "Relieved by "+m.name+otLabel(m)+" · came off "+targetSeatLabel+(moved.length?" · crew jigged: "+moved.map(x=>x.name+" → "+seatById(x.seatId).label).join(", "):""),
      skips
    );
    say(note+m.name+" signed on "+fmt(ts)+otLabel(m)+", relieving "+target.name+" ("+fmt(target.signOn)+"). "+m.name+" now at "+seatOfIncomer.truckName+" "+seatOfIncomer.label+"."+jig+swapHint(m), (skips.length||moved.length)?"warn":"ok");
    commit();
    return true;
  }
  return false;
}

// Explicit relief for someone already on the board without a seat (relievers pool or
// awaiting-seat core): they relieve the first eligible person out, on request only.
function relieveNextOut(id){
  const m=state.members.find(x=>x.id===id); if(!m||m.status!=="on"||m.seatId) return;
  selectedId=null;
  if(!attemptRelief(m, m.signOn||nowMs())){
    say("No one can be relieved by "+m.name+" without breaking crewing. Adjust seats manually or use them elsewhere.","warn");
    render();
  }
}

function signOn(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  const ts = nowMs();
  const occ = occupancy(state.members);

  // Relievers (home AND external) default to the relievers pool — a reliever may be
  // scheduled to be sent out regardless, so they never relieve anyone automatically.
  // EXCEPTIONS:
  //   - The reliever ticked "staying at Perth" at sign-on (m.staying): the shift has been
  //     told to expect them, so seat them at any eligible empty seat before pooling.
  //   - Otherwise, if an empty seat exists that no core member can fill, the shift genuinely
  //     needs the reliever on a truck.
  if(canRelieveOut(m)){
    const fitsWithPair = (s, p) => {
      if(!seatEligibility(s,p).ok) return false;
      // Simulate them in the seat and run all pump rules (junior pairing + minimum one
      // Senior Firefighter aboard) so auto-seat can't complete an illegal truck.
      if(s.truckId==="p1"||s.truckId==="p2"){
        const sim={...occ,[s.id]:p};
        if(pairIssue(s.truckId,sim)) return false;
      }
      return true;
    };
    const eligible = activeSeats().filter(s=>!occ[s.id] && fitsWithPair(s,m))
      .sort((a,b)=>SEAT_PRIORITY[a.role]-SEAT_PRIORITY[b.role]);
    let seatToTake=null, reason="";
    if(m.staying && eligible.length){
      seatToTake=eligible[0];
      reason=" and is staying at Perth — seated at "+seatToTake.truckName+" "+seatToTake.label+".";
    } else if(eligible.length){
      const coreAvailable = state.members.filter(x=>!canRelieveOut(x) && (
          (x.status==="on" && !x.seatId) ||
          (x.status==="off" && x.avail==="Available" && x.shift===state.shift)
      ));
      const uncoverable = eligible.filter(s=>!coreAvailable.some(c=>fitsWithPair(s,c)));
      if(uncoverable.length){
        seatToTake=uncoverable[0];
        reason=" and is crewing "+seatToTake.truckName+" "+seatToTake.label+" — no core member can fill it. Move them to the pool later if core cover arrives.";
      }
    }
    if(seatToTake){
      m.status="on"; m.seatId=seatToTake.id; m.signOn=ts; m.forced=false; classifyArrival(m,true);
      say(m.name+" signed on "+fmt(ts)+otLabel(m)+reason+swapHint(m), m.staying?"ok":"warn");
      commit(); return;
    }
    m.status="on"; m.seatId=null; m.signOn=ts; classifyArrival(m,false);
    const poolTail = m.staying ? " (staying — kept on station, not sent out)" : " — not relieving anyone. Send them out, seat them, or tap Relieve next out.";
    say(m.name+" signed on "+fmt(ts)+otLabel(m)+" to the relievers pool"+poolTail+swapHint(m),"ok");
    commit(); return;
  }

  // 1. best empty eligible seat (board not yet full) — just fill it
  const empties = activeSeats()
    .filter(s=>!occ[s.id] && seatEligibility(s,m).ok)
    .filter(s=>{
      // Full pump-rule simulation: junior pairing + minimum one Senior aboard.
      if(s.truckId!=="p1" && s.truckId!=="p2") return true;
      const sim={...occ,[s.id]:m};
      return !pairIssue(s.truckId,sim);
    })
    .sort((a,b)=>SEAT_PRIORITY[a.role]-SEAT_PRIORITY[b.role]);
  if(empties.length){
    const seat=empties[0];
    m.status="on"; m.seatId=seat.id; m.signOn=ts; m.forced=false;
    classifyArrival(m,true); // they filled a hole — the shift could not crew this seat itself
    say(m.name+" signed on "+fmt(ts)+otLabel(m)+". Seated: "+seat.truckName+" "+seat.label+"."+swapHint(m),"ok");
    commit(); return;
  }

  // 2. board full: FIFO relief with rearrangement (see attemptRelief)
  if(attemptRelief(m, ts)) return;

  // 3. nobody can be freed: they join the on-duty queue awaiting a seat
  m.status="on"; m.seatId=null; m.signOn=ts; classifyArrival(m,false);
  say(m.name+" signed on "+fmt(ts)+" — no seat can be freed without breaking crewing. They're in the on-duty queue and take the next seat that opens. Core members aren't sent out relieving."+swapHint(m),"warn");
  commit();
}

function issuesForPlacement(m, seat, ignoreId){
  const list=[];
  const el=seatEligibility(seat,m);
  if(!el.ok) list.push(el.reason);
  const occ=occupancy(state.members);
  const sim={...occ};
  if(ignoreId) Object.keys(sim).forEach(k=>{ if(sim[k].id===ignoreId) delete sim[k]; });
  if(m.seatId) delete sim[m.seatId];
  sim[seat.id]=m;
  ["p1","p2"].forEach(tid=>{ const p=pairIssue(tid,sim); if(p) list.push(p); });
  return list;
}

function seatTapped(seatId){
  const seat=seatById(seatId);
  const occ=occupancy(state.members);
  const sitting=occ[seatId]||null;
  const sel = selectedId ? state.members.find(x=>x.id===selectedId) : null;
  if(!sel){ if(sitting){ selectedId=sitting.id; render(); } return; }
  if(sitting && sitting.id===sel.id){ selectedId=null; render(); return; }

  const apply=(fA,fB)=>{
    const oldSeat=sel.seatId||null;
    sel.status="on"; sel.seatId=seat.id; sel.forced=fA; if(!sel.signOn) sel.signOn=nowMs();
    if(sitting){ sitting.seatId=oldSeat; sitting.forced=fB; sitting.status="on"; }
    selectedId=null; confirmBox=null;
    say(sitting? sel.name+" and "+sitting.name+" swapped." : sel.name+" moved to "+seat.truckName+" "+seat.label+".", (fA||fB)?"warn":"ok");
    commit();
  };
  const probsA=issuesForPlacement(sel,seat,sitting?sitting.id:null);
  let probsB=[];
  if(sitting && sel.seatId) probsB=issuesForPlacement(sitting, seatById(sel.seatId), sel.id);
  const all=[...probsA,...probsB];
  if(!all.length){ apply(false,false); return; }
  confirmBox={
    text: sitting? "Swap "+sel.name+" and "+sitting.name+"?" : "Seat "+sel.name+" at "+seat.truckName+" "+seat.label+"?",
    issues:all,
    onConfirm:()=>apply(probsA.length>0, probsB.length>0)
  };
  render();
}

// Undo a mistaken sign-on: puts the member back to `off` with all sign-on state cleared,
// as if they never tapped their name. Does NOT stamp them as off-going, does NOT punish
// their fairness tally, does NOT add them to the queue of relieved members.
function removeMistap(){
  const sel = state.members.find(x=>x.id===selectedId); if(!sel || sel.status!=="on") return;
  const wasOT = sel.ot && sel.ot!=="Standby";
  const wasStandby = sel.ot==="Standby";
  const name = sel.name;
  // Unwind sign-on state
  sel.status = "off"; sel.seatId = null; sel.signOn = null; sel.forced = false;
  sel.ot = ""; sel.excHours = false; sel.staying = false;
  // Unwind auto-flagged OT tally so fairness isn't punished for a mis-tap
  if(wasOT) unstampOT(sel);
  // Unwind standby ledger auto-entry if one was written for this member
  if(wasStandby && sel.coveringFor){
    const idx = state.standbys.findIndex(s=>s.note==="swap" && s.coverer===sel.id && s.coveree===sel.coveringFor);
    if(idx>=0) state.standbys.splice(idx,1);
    delete sel.coveringFor;
  }
  // Unwind super-holdback release if we set one
  if(sel.superHBKey && sel.superHBReleased){
    sel.superHBReleased = sel.superHBReleased.filter(k=>k!==sel.superHBKey);
    delete sel.superHBKey;
  }
  selectedId = null; confirmBox = null;
  say(name+" removed from the board — mis-tap. Their sign-on wasn't recorded.","info");
  commit();
}

function releaseSelected(){
  const sel=state.members.find(x=>x.id===selectedId);
  if(!sel||sel.status!=="on") return;
  const seat=sel.seatId?seatById(sel.seatId):null;
  const probs=[];
  if(seat){
    probs.push(seat.truckName+" "+seat.label+" will be unfilled");
    const sim=swapKeepsCounts(state.members, sel, null);
    if(!sim.ok) probs.push("Drops "+sim.which);
  }
  const doIt=()=>{
    const freedSeat = sel.seatId ? seatById(sel.seatId) : null;
    sel.status="out"; sel.seatId=null; selectedId=null; confirmBox=null;
    // Core members always stay and fill a truck: earliest on-duty core member without a
    // seat backfills the freed seat automatically (if the seat rules allow them there).
    let backfill="";
    let backfillNote=null;
    if(freedSeat){
      const occ2=occupancy(state.members);
      const waiting=state.members.filter(x=>x.status==="on"&&!x.seatId&&!canRelieveOut(x)).sort((a,b)=>a.signOn-b.signOn);
      const filler=waiting.find(w=>{
        if(!seatEligibility(freedSeat,w).ok) return false;
        if(freedSeat.truckId==="p1"||freedSeat.truckId==="p2"){
          const sim={...occ2,[freedSeat.id]:w};
          if(pairIssue(freedSeat.truckId,sim)) return false;
        }
        return true;
      });
      if(filler){ filler.seatId=freedSeat.id; filler.forced=false; backfill=" "+filler.name+" backfilled "+freedSeat.truckName+" "+freedSeat.label+"."; backfillNote=filler.name+" backfilled "+freedSeat.truckName+" "+freedSeat.label; }
    }
    pushRelease(
      sel.name+" released off duty",
      (freedSeat ? "Came off "+freedSeat.truckName+" "+freedSeat.label : "Manual release") + (backfillNote?" · "+backfillNote:"")
    );
    say(sel.name+" released off duty."+backfill, probs.length?"warn":"ok");
    commit();
  };
  if(probs.length){ confirmBox={text:"Release "+sel.name+"?", issues:probs, onConfirm:doIt}; render(); }
  else doIt();
}

function holdBack(id, need){
  const m=state.members.find(x=>x.id===id); if(!m) return;
  const occ=occupancy(state.members);
  const empties=activeSeats().filter(s=>!occ[s.id]&&seatEligibility(s,m).ok)
    .sort((a,b)=>SEAT_PRIORITY[a.role]-SEAT_PRIORITY[b.role]);
  const preferred=empties.find(s=>s.role===need)||empties[0]||null;
  m.status="on"; m.ot="Holdback"; if(!m.signOn) m.signOn=nowMs();
  stampOT(m);
  m.seatId=preferred?preferred.id:null;
  say(m.name+" held back on voluntary overtime"+(preferred?" at "+preferred.truckName+" "+preferred.label:" (standby, seat manually)")+".","ok");
  commit();
}

// Step a shortage forward through the SOP matrix. Manual advance — the SO decides when
// the current step's people are exhausted or unwilling.
function escalateShortage(stepKey){
  state.shortageStep = state.shortageStep || {};
  const sop = currentShortageOrder();
  if(!sop) return;
  const step = state.shortageStep[stepKey] || 0;
  if(step >= sop.order.length-1) return;
  state.shortageStep[stepKey] = step+1;
  const next = sop.order[step+1];
  say("Shortage escalated: now "+(next.platoon==="ASPSA"?"ASPSA (super holdback or truck offline)":next.platoon+" "+next.action)+".","info");
  commit();
}

function requestReliever(need){
  state.relieverReqs.push({need, at:Date.now()});
  say("Reliever requested: "+need+". Log it through the normal channel; this board only records the flag. Tap the flag to clear it once actioned.","info");
  commit();
}
// Records that a member was called back for OT. Stamps their fairness tally so they drop
// to the bottom of the callback order; doesn't sign them on — the SO makes the call and the
// member signs on when they arrive. If they decline or don't come in, Undo reverses it.
function callBack(id){
  const m=state.members.find(x=>x.id===id); if(!m) return;
  stampOT(m);
  say(m.name+" called for a callback ("+m.shift+" shift). They'll sign on when they arrive; the tally already moved them to the bottom of the order. Undo to reverse if they can't come in.","info");
  commit();
}
function dismissRelieverReq(i){
  state.relieverReqs.splice(i,1);
  say("Reliever request cleared.","info");
  commit();
}

function commit(){
  undoSnap = lastCommitted;           // state before the mutation that just happened
  lastCommitted = JSON.stringify(state);
  save(); render();
}
function undo(){
  if(!undoSnap){ say("Nothing to undo.","info"); render(); return; }
  state = JSON.parse(undoSnap);
  undoSnap = null; lastCommitted = JSON.stringify(state);
  selectedId=null; confirmBox=null;
  say("Undone — board restored to before the last action.","info");
  save(); render();
}
// keep external-reliever id counter ahead of anything already stored
(function(){ const ext=state.members.filter(m=>m.ext).map(m=>m.id); if(ext.length) relSeq=Math.max(relSeq, ...ext); })();

// ---- Crewing suggestions: who can fill a given empty seat, best first ----
function candidatesForSeat(seat){
  const occ = occupancy(state.members);
  // pool = anyone who could come on: available (this or other shift) + current standby
  const pool = state.members.filter(m =>
    (m.status==="off" && m.avail==="Available") || (m.status==="on" && !m.seatId)
  );
  const eligible = pool.filter(m=>{
    const el = seatEligibility(seat, m);
    if(!el.ok) return false;
    // Simulate them in the seat and run the full pump rules (junior pairing + minimum
    // one Senior Firefighter aboard) so suggestions never propose an illegal truck.
    if(seat.truckId==="p1"||seat.truckId==="p2"){
      const sim = {...occ, [seat.id]: m};
      if(pairIssue(seat.truckId, sim)) return false;
    }
    return true;
  });
  // score: tighter fit and shift/VR value ranked first
  const score = m => {
    let s = 0;
    if(m.shift===state.shift) s += 100;                 // prefer the rostered shift
    if(m.status==="on" && !m.seatId) s += 40;           // already on station (standby)
    if(seat.role==="CLP" && m.clp) s += 20;
    if(seat.role==="DRV" && m.topo) s += 20;
    if(seat.role==="FF1" && m.rank==="SFF") s += 10;    // senior over striper for FF1
    if((seat.role==="FF2") && isJunior(m)) s += 8;      // juniors naturally sit FF2
    if(m.vr) s += 4;                                     // helps the VR count
    return s;
  };
  return eligible.sort((a,b)=>score(b)-score(a));
}

// ---- Standby ledger ----
// A standby: the coverer works a day in place of the coveree. The coveree then owes the coverer one back.
// A "party" is either a Perth member (numeric id) or an external person {n:name, s:station}.
// Reconciling logs the reverse standby (the payback), which nets the debt down.
let sbStaff = null;   // selected party key, e.g. "m:8" or "e:bain|ellenbrook"

const isExt = p => typeof p === "object" && p !== null;
function partyKey(p){ return isExt(p) ? ("e:"+(p.n||"").trim().toLowerCase()+"|"+(p.s||"").trim().toLowerCase()) : ("m:"+p); }
function partyLabel(p){ return isExt(p) ? (p.n + (p.s? " @ "+p.s : "")) : memberName(p); }
function partySub(p){ return isExt(p) ? (p.s||"other station") : memberShift(p); }
function resolveParty(key){
  if(key.startsWith("m:")) return parseInt(key.slice(2),10);
  for(const s of state.standbys){ for(const p of [s.coverer,s.coveree]){ if(isExt(p)&&partyKey(p)===key) return p; } }
  return null;
}

function selectStaff(key){ sbStaff = (sbStaff===key?null:key); sbPick=""; sbExtName=""; sbExtStn=""; sbMode="member"; render(); }
function setSbQuery(v){ sbQuery=v; render(); }

function logStandby(coverer, coveree, note){
  if(coverer==null || coveree==null) return;
  if(partyKey(coverer)===partyKey(coveree)) return;
  state.standbys.unshift({ id:Date.now()+Math.floor(Math.random()*1000), coverer, coveree, date:new Date().toISOString().slice(0,10), note:note||"" });
  const c=partyLabel(coverer), o=partyLabel(coveree);
  say(c+" covered for "+o+". "+o+" owes "+c+" one"+(note?" ("+note+")":"")+".", "ok");
  commit();
}
function counterpartParty(){
  if(sbMode==="member"){ const id=parseInt(sbPick,10); return id?id:null; }
  const n=(sbExtName||"").trim(); if(!n) return null;
  return { n, s:(sbExtStn||"").trim() };
}
function logForStaff(direction){
  const sel = resolveParty(sbStaff);
  const other = counterpartParty();
  if(sel==null || other==null){ say("Enter the other person first (pick a Perth member or type an external name).","warn"); render(); return; }
  if(direction==="did") logStandby(sel, other);   // selected covered for other
  else logStandby(other, sel);                     // other covered for selected
  sbPick=""; sbExtName=""; sbExtStn="";
}
function reconcilePayback(selKey, otherKey){ logStandby(resolveParty(selKey), resolveParty(otherKey), "payback"); }  // selected pays other back
function reconcileRepaid(selKey, otherKey){ logStandby(resolveParty(otherKey), resolveParty(selKey), "payback"); }   // other pays selected back
function deleteStandby(sid){

// Quick-log form handlers
function qSet(k,v){ ({self:()=>qSelf=v, dir:()=>qDir=v, mode:()=>qMode=v, pick:()=>qPick=v, name:()=>qName=v, stn:()=>qStn=v})[k](); render(); }

  if(!other){ say("Enter who the standby was with (a Perth member, or a name for another station).","warn"); render(); return; }
  if(qDir==="byme") logStandby(self, other);   // I covered them -> they owe me
  else logStandby(other, self);                // they covered me -> I owe them
  qPick=""; qName=""; qStn="";

// Pairwise standing for one party key: who they owe, and who owes them (reciprocals cancelled).
function personBalances(key){
  const pair={};
  state.standbys.forEach(s=>{ pair[partyKey(s.coverer)+"|"+partyKey(s.coveree)] = (pair[partyKey(s.coverer)+"|"+partyKey(s.coveree)]||0)+1; });
  const others=new Map();
  state.standbys.forEach(s=>{
    if(partyKey(s.coverer)===key) others.set(partyKey(s.coveree), s.coveree);
    if(partyKey(s.coveree)===key) others.set(partyKey(s.coverer), s.coverer);
  });
  const owes=[], owed=[];
  others.forEach((party,ok)=>{
    const pCovO = pair[key+"|"+ok]||0;  // sel covered other -> other owes sel
    const oCovP = pair[ok+"|"+key]||0;  // other covered sel -> sel owes other
    const net = pCovO - oCovP;
    if(net>0) owed.push({key:ok, party, n:net});
    else if(net<0) owes.push({key:ok, party, n:-net});
  });
  owes.sort((a,b)=>b.n-a.n); owed.sort((a,b)=>b.n-a.n);
  return {owes, owed};
}

// ---- Rotate crews: same people, new seats each set, so everyone works together ----
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function rotateCrews(){
  const occ = occupancy(state.members);
  const pumpSeats = ["p1-so","p1-drv","p1-ff1","p1-ff2","p2-so","p2-drv","p2-ff1","p2-ff2"];
  const filled = pumpSeats.filter(id=>occ[id]);
  if(filled.length < 3){ say("Not enough crew seated on the pumps to rotate.","warn"); render(); return; }

  const prev = {}; filled.forEach(id=>{ prev[id]=occ[id].id; });
  const officers = filled.filter(id=>occ[id].rank==="SO").map(id=>occ[id]);
  const ffs = filled.filter(id=>occ[id].rank!=="SO").map(id=>occ[id]);
  const soSeats  = ["p1-so","p2-so"].filter(id=>occ[id]);
  const drvSeats = ["p1-drv","p2-drv"].filter(id=>occ[id]);
  const ff1Seats = ["p1-ff1","p2-ff1"].filter(id=>occ[id]);
  const ff2Seats = ["p1-ff2","p2-ff2"].filter(id=>occ[id]);

  function attempt(){
    const a = {};
    const off = shuffle([...officers]);
    soSeats.forEach((id,i)=>{ if(off[i]) a[id]=off[i]; });
    let pool = shuffle([...ffs]);
    drvSeats.forEach(id=>{ const i=pool.findIndex(m=>m.topo); if(i>=0){ a[id]=pool[i]; pool.splice(i,1); } });
    ff1Seats.forEach(id=>{ let i=pool.findIndex(m=>seniorOrStripe(m)); if(i<0) i=0; if(pool[i]){ a[id]=pool[i]; pool.splice(i,1); } });
    ff2Seats.forEach(id=>{ if(pool.length) a[id]=pool.shift(); });
    return a;
  }
  function valid(a){
    if(Object.keys(a).length !== filled.length) return false;
    for(const [id,m] of Object.entries(a)){ if(!seatEligibility(seatById(id),m).ok) return false; }
    for(const tid of ["p1","p2"]){ if(pairIssue(tid,a)) return false; }
    return true;
  }
  const differs = a => Object.keys(a).some(id => prev[id]!==a[id].id);

  let chosen=null;
  for(let i=0;i<80;i++){ const a=attempt(); if(valid(a)&&differs(a)){ chosen=a; break; } }
  if(!chosen){ for(let i=0;i<80;i++){ const a=attempt(); if(valid(a)){ chosen=a; break; } } }
  if(!chosen){ say("Couldn't find a valid new arrangement with this crew, the rules leave no room to reshuffle.","warn"); render(); return; }

  const arr = {};
  Object.entries(chosen).forEach(([id,m])=>{ const mm=state.members.find(x=>x.id===m.id); mm.seatId=id; mm.forced=false; arr[id]=m.id; });
  // rotate the two CLP operators as well
  if(occ["clp-1"] && occ["clp-2"]){
    const a=occ["clp-1"].id, b=occ["clp-2"].id;
    state.members.find(x=>x.id===a).seatId="clp-2";
    state.members.find(x=>x.id===b).seatId="clp-1";
    arr["clp-1"]=b; arr["clp-2"]=a;
  } else {
    if(occ["clp-1"]) arr["clp-1"]=occ["clp-1"].id;
    if(occ["clp-2"]) arr["clp-2"]=occ["clp-2"].id;
  }
  state.setArrangement = arr;
  say("New crew arrangement locked in, same people in new seats. This holds for the whole set; re-apply it each shift with Apply current set.","ok");
  commit();
}

// ---- Truck offline & holdback / OT ----
function toggleOffline(tid){

function toggleOT(id, type){
  const m=state.members.find(x=>x.id===id); if(!m) return;
  const wasStandby = m.ot==="Standby";
  const wasOT = m.ot && m.ot!=="Standby"; // Holdback / Callback / Super holdback all count for the tally
  const prev = m.ot;
  m.ot = (m.ot===type ? "" : type);
  const nowOT = m.ot && m.ot!=="Standby";
  // Standby swap link housekeeping (unchanged)
  if(wasStandby && m.ot!=="Standby"){
    if(m.coveringFor){
      const idx = state.standbys.findIndex(s=>s.note==="swap" && !isExt(s.coverer) && !isExt(s.coveree) && s.coverer===m.id && s.coveree===m.coveringFor);
      if(idx>=0) state.standbys.splice(idx,1);
    }
    delete m.coveringFor;
  }
  // Fairness tally: bump when entering an OT type; restore when leaving all OT.
  if(!wasOT && nowOT) stampOT(m);
  else if(wasOT && !nowOT) unstampOT(m);
  // Super holdback release cascade — apply on entry, reverse on exit.
  if(prev==="Super holdback" && m.ot!=="Super holdback"){
    // Reverse: drop the release entry we recorded when we entered
    const key = m.superHBKey;
    if(key && m.superHBReleased){
      m.superHBReleased = m.superHBReleased.filter(k=>k!==key);
    }
    delete m.superHBKey;
  }
  if(prev!=="Super holdback" && m.ot==="Super holdback"){
    const key = nextRosteredKey(m);
    if(key){
      m.superHBKey = key;
      m.superHBReleased = m.superHBReleased || [];
      if(!m.superHBReleased.includes(key)) m.superHBReleased.push(key);
    }
  }
  if(!m.ot) say(m.name+" OT/standby flag cleared.","info");
  else if(m.ot==="Standby") say(m.name+" marked as Standby — a shift-for-shift swap. Pick who they're covering for on the OT panel to log the debt in the ledger.","info");
  else if(m.ot==="Super holdback"){
    const key = m.superHBKey || "";
    say(m.name+" marked SUPER HOLDBACK — working through, released from their next rostered shift ("+esc(key)+"). Reverse by tapping the flag again.","warn");
  }
  else say(m.name+" marked as "+m.ot+" (overtime).","info");
  commit();
}
// Pick the person a standby is covering for. Coverer works, so the covered person owes them.
function setCoveringFor(coverId, coveredId){
  const cover = state.members.find(x=>x.id===coverId); if(!cover||cover.ot!=="Standby") return;
  const cid = parseInt(coveredId,10);
  if(!cid){
    // clearing the pick: pull the auto-entry if any
    if(cover.coveringFor){
      const idx = state.standbys.findIndex(s=>s.note==="swap" && s.coverer===cover.id && s.coveree===cover.coveringFor);
      if(idx>=0) state.standbys.splice(idx,1);
      delete cover.coveringFor;
      say("Standby target cleared.","info");
      commit();
    }
    return;
  }
  const covered = state.members.find(x=>x.id===cid); if(!covered) return;
  // remove any prior auto-entry for this coverer, then log the new one
  const prior = state.standbys.findIndex(s=>s.note==="swap" && s.coverer===cover.id && s.coveree===(cover.coveringFor||-1));
  if(prior>=0) state.standbys.splice(prior,1);
  cover.coveringFor = cid;
  state.standbys.unshift({
    id: Date.now()+Math.floor(Math.random()*1000),
    coverer: cover.id, coveree: cid,
    date: new Date(nowMs()).toISOString().slice(0,10),
    note: "swap"
  });
  say(cover.name+" is covering "+covered.name+"'s "+covered.shift+" shift. "+covered.name+" owes "+cover.name+" one — logged in the ledger.","ok");
  commit();
}
// Reliever (home or external) on duty but unseated, sent out to cover shortfalls at another metro station.
// Core members, temp transfers and Station Officers are never sent out relieving.
// State for the "back when?" picker shown after tapping Send relieving.
// { memberId, mode } — mode is null (picker open), "shift" (this shift only) or "date" (custom).
let relievingOutPicker = null;

// End of the current on-duty shift in ms — used for the "this shift only" default.
function currentShiftEndMs(){
  const now = nowDate();
  const h = now.getHours() + now.getMinutes()/60;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(h>=6 && h<8)   return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0, 0, 0).getTime();   // day starts 08:00
  if(h>=8 && h<16)  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 18, 0, 0, 0).getTime();  // day shift ends 18:00
  if(h>=16 && h<18) return new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 8, 0, 0, 0).getTime(); // night starts 18:00, ends 08:00 tomorrow
  if(h>=18)         return new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 8, 0, 0, 0).getTime(); // still that night
  // before 06:00 — last night's crew: shift ends 08:00 today
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0, 0, 0).getTime();
}

// Auto-clear Relieving out whose end date has passed. Called each render; safe to run often.
function autoClearRelievingOut(){
  const t = nowMs();
  let cleared = 0;
  state.members.forEach(m=>{
    if(m.avail==="Relieving out" && m.relievingOutUntil && t >= m.relievingOutUntil){
      m.avail = "Available";
      delete m.relievingOutUntil;
      cleared++;
    }
  });
  return cleared;
}

// Format an end-time for display — "back at 18:00", "back 15 Aug".
function relOutUntilLabel(ms){
  if(!ms) return "";
  const d = new Date(ms);
  const now = nowDate();
  const sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  const nextDay = ()=>{const t=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1); return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();};
  if(sameDay || (nextDay() && d.getHours()===8)) return "back "+fmt(ms);
  return "back "+d.toLocaleDateString([], {day:"2-digit",month:"short"});
}

function sendRelieving(id){
  const m=state.members.find(x=>x.id===id); if(!m) return;
  if(!canRelieveOut(m)){ say(m.name+" is core crew — core members, temp transfers and SOs aren't sent out relieving. Flag them RELIEVER in the Roster tab first if that's wrong.","warn"); render(); return; }
  if(m.staying){ say(m.name+" is staying at Perth — clear the staying flag first if that's changed.","warn"); render(); return; }
  if(m.status!=="on" || m.seatId){ say(m.name+" is crewing a seat — free the seat first before sending them out relieving.","warn"); render(); return; }
  // Open the "back when?" picker rather than committing immediately. The picker renders
  // inline in the action bar (see render()).
  relievingOutPicker = { memberId: id, mode: null, dateVal: "" };
  render();
}
// Commit the send-relieving action with a chosen return time. Called from picker buttons.
function commitSendRelieving(id, until){
  const m=state.members.find(x=>x.id===id); if(!m) return;

  if(until) m.relievingOutUntil = until; else delete m.relievingOutUntil;
  relievingOutPicker=null; selectedId=null;
  const suffix = until ? " ("+relOutUntilLabel(until)+")" : " (indefinite — clear manually)";
  say(m.name+" sent out relieving"+suffix+".","ok");
  commit();
}

// Called from the picker's inline handlers. Kept out-of-line because inline HTML handlers

// Jump to the Standbys tab with the swap half-filled: the standby person covered for someone,
// so pick the coveree and Log standby records the debt in one tap.
function logSwapFor(id){
  const m=state.members.find(x=>x.id===id); if(!m) return;
  qSelf=String(id); qDir="byme"; qMode="member"; qPick=""; sbStaff="m:"+id; selectedId=null;
  say("Pick who "+m.name+" is covering for, then Log standby — the debt lands in the ledger.","info");
  setTab("standby");
}
function copyShiftMsg(){
  const txt = generateShiftMessage(state.members);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>say("Shift message copied.","ok"), ()=>say("Copy failed, select the text and copy manually.","warn"));
  } else { say("Select the text in the box and copy manually.","info"); }
  render();
}
const needLabel = { SO:"Station Officer", DRV:"topo driver", CLP:"CLP operator (senior)", FF1:"FF1 (striper/senior)", VR:"VR technician (VR, or FF with CSR/RRS)", VR_SO:"Station Officer holding VR" };
function generateShiftMessage(members){
  const occ=occupancy(members);
  const active=state.shift;
  const now=new Date();
  const dt=now.toLocaleDateString([], {weekday:"short",day:"2-digit",month:"short"})+" "+fmt(now.getTime());
  let L=[];
  L.push("PERTH STATION — "+active+" SHIFT");
  L.push(dt);
  L.push("");
  // trucks — who fills what position, seat by seat
  L.push("TRUCKS");
  TRUCKS.forEach(t=>{
    if(truckOffline(t.id)){ L.push("  "+t.name+": OFFLINE"); return; }
    L.push("  "+t.name+" ("+t.sub+")");
    t.seats.forEach(s=>{
      const m=occ[s.id];
      let line="    "+s.label+": ";
      if(!m){ L.push(line+"UNFILLED"); return; }
      line+=m.name;
      if(m.ot) line+=" \u2014 "+(m.ot==="Standby"?"Standby swap":m.ot+" OT");
      if(m.excHours) line+=" \u2014 excessive hours";
      const el=seatEligibility({...s,truckId:t.id,truckName:t.name},m);
      if(!el.ok) line+="  (! "+el.reason.toLowerCase()+")";
      L.push(line);
    });
    if(t.id!=="clp"){ const p=pairIssue(t.id,occ); if(p) L.push("    (! "+p+")"); }
  });
  // FUTURE: daily tasks / scheduled checks section slots in here (per-shift checklist,
  // BA/appliance checks, hydrant runs etc.) — planned for a later iteration.
  const vs=vrStatus(members);
  const c=shiftCounts(members);
  L.push("");
  L.push("REQUIREMENTS");
  L.push("  VR "+vs.effective+"/"+VR_TOTAL+(vs.subUsed?" (incl. 1 CSR/RRS)":"")+(vs.soVR?"":" — NO SO WITH VR")+"   SNAPs(SO) "+c.so+"/"+REQ_SO+"   CLP "+(truckOffline("clp")?"offline":(["clp-1","clp-2"].every(id=>occ[id]&&seatEligibility(seatById(id),occ[id]).ok)?"crewed":"short")));
  // shortfalls + holdback/callback determination
  const issues=boardIssues(members);
  L.push("");
  if(!issues.length){
    L.push("CREWING: fully crewed, no holdbacks or callbacks required.");
  } else {
    L.push("SHORTFALLS");
    issues.forEach(i=>L.push("  - "+i.text));
    const needs=[...new Set(issues.map(i=>i.need))];
    L.push("");
    L.push("HOLDBACK / CALLBACK REQUIRED");
    needs.forEach(need=>{
      const onShiftFree = members.filter(m=>m.avail==="Available"&&m.status==="off"&&m.shift===active&&coversNeed(m,need));
      const label=needLabel[need]||need;
      if(onShiftFree.length){
        L.push("  "+label+": "+onShiftFree.length+" available on shift ("+onShiftFree.slice(0,5).map(m=>m.name).join(", ")+")");
      } else {
        const otherFree = members.filter(m=>m.avail==="Available"&&m.status==="off"&&m.shift!==active&&coversNeed(m,need));
        L.push("  "+label+": none on shift — OT holdback/callback required"+(otherFree.length?" (able off-shift: "+otherFree.slice(0,4).map(m=>m.name+" "+m.shift).join(", ")+")":", or external reliever"));
      }
    });
  }
  // current OT (standby swaps are not OT and are listed separately)
  const ot=members.filter(m=>m.status==="on"&&m.ot&&m.ot!=="Standby");
  if(ot.length){
    L.push("");
    L.push("ON OT NOW");
    ot.forEach(m=>L.push("  - "+m.name+" ("+m.ot+(m.shift!==active?", "+m.shift+" shift":"")+(m.excHours?", excessive hours":"")+(m.ot==="Super holdback"&&m.superHBKey?", released "+m.superHBKey:"")+")"));
  }
  const sbSwaps=members.filter(m=>m.status==="on"&&m.ot==="Standby");
  if(sbSwaps.length){
    L.push("");
    L.push("ON STANDBY (SWAP, NOT OT)");
    sbSwaps.forEach(m=>L.push("  - "+m.name+(m.shift!==active?" ("+m.shift+" shift)":"")));
  }
  // relievers to send out — handoff to reliever tracker
  const relOut=members.filter(m=>m.status==="on"&&!m.seatId&&canRelieveOut(m));
  const unalloc=members.filter(m=>m.status==="on"&&!m.seatId&&!canRelieveOut(m));
  L.push("");
  L.push("RELIEVING");
  if(relOut.length) L.push("  Relievers on station, available to send out: "+relOut.map(m=>m.name).join(", "));
  if(unalloc.length) L.push("  Awaiting a truck seat (core — stay on, not sent relieving): "+unalloc.map(m=>m.name).join(", "));
  L.push("  Who goes out relieving: per the relieving tracker (surge firefighters first, then home relievers by lowest tally, fairness kept). Confirm before sending.");
  L.push("");
  L.push("— Perth E-Duty Board (concept)");
  return L.join("\n");
}

function fullReset(){
  confirmBox={text:"Full reset? This restores the seeded roster and wipes all saved changes on this device.", issues:["All tag edits, availability changes, sign-ons and shift notes will be lost","Consider Export backup first if you want a way back","Undo can still restore for one action after this"], onConfirm:()=>{
    localStorage.removeItem(STORE_KEY);
    undoSnap = lastCommitted;
    state=load(); lastCommitted=JSON.stringify(state);
    selectedId=null; confirmBox=null;
    say("Restored to seed roster.","info"); render();
  }};
  render();
}
// New shift (clear board): wipe on-duty state and per-shift flags but keep roster edits.
// Availability, tags, notes, RELIEVER flags and forecast holdback notes all stay.
function clearBoard(){
  const onCount = state.members.filter(m=>m.status==="on" || m.status==="out").length;
  confirmBox={text:"Clear the board for a new shift?", issues:[
    onCount+" on-duty and off-going sign-ons will be cleared",
    "OT flags, Staying, Standby pairings and Super holdback releases are wiped",
    "Roster tab (availability, tags, notes, RELIEVER flags) is kept",
    "Forecast holdback notes for the incoming shift stay",
    "Undo restores this"
  ], onConfirm:()=>{
    state.members.forEach(m=>{
      m.status="off"; m.seatId=null; m.signOn=null; m.forced=false;
      m.ot=""; m.excHours=false; m.staying=false;
      delete m.coveringFor;
      delete m.expectedOff; // expected-off predictions applied to the shift now starting
      m.superHBReleased = [];
      delete m.superHBKey;
    });
    state.relieverReqs = [];
    state.shortageStep = {};
    releaseNotes = [];
    selectedId=null; confirmBox=null;
    say("Board cleared for new shift. Roster and forecast notes kept.","info");
    commit();
  }};
  render();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="perth-duty-board-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  say("Board exported as a JSON file. Keep it as a backup or import it on another device.","info");
  render();
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const data=JSON.parse(r.result);
      if(!data.members) throw new Error("bad file");
      undoSnap = lastCommitted;
      state=data; lastCommitted=JSON.stringify(state);
      save(); say("Board imported.","ok"); render();
    }catch(e){ say("That file could not be read as a board export.","bad"); render(); } };
  r.readAsText(f);
}

  document.getElementById("tab-board").classList.toggle("active",t==="board");
  document.getElementById("tab-roster").classList.toggle("active",t==="roster");
  document.getElementById("tab-standby").classList.toggle("active",t==="standby");

  document.getElementById("view-standby").classList.toggle("hidden",t!=="standby");
  document.getElementById("view-forecast").classList.toggle("hidden",t!=="forecast");
